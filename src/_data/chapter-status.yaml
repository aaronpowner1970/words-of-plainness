# ═══════════════════════════════════════════════════════════════════
# Words of Plainness — Chapter Status Registry
# Source of truth for the volume landing pages, plus per-chapter
# deployment state, assets, and infrastructure across both volumes.
#
# To activate a chapter on the volume pages, set its status to
# 'available'. The landing pages render from this file.
#
# NUMBERING: Uses LIVE SITE numbering (wordsofplainness.org),
# NOT repo file numbering. Repo file paths noted in `file` field.
#
# STATUS values (per chapter): available | coming-soon
#   'available'   → chapter is linked from the volume landing page with
#                   an "Available" badge. Requires `url`.
#   'coming-soon' → chapter is shown on the landing page as a muted
#                   "Coming Soon" row. No link is rendered.
#
# Movements are ordered lists; the volume pages iterate them in the
# order given here. Each movement carries the presentation metadata
# (label, name, description, theme_class, acc_id) that used to be
# hand-typed into the accordion markup.
#
# Last verified: August 1, 2026
# ═══════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════
# COMPOSITE PIPELINES
# ═══════════════════════════════════════════════════════════════════

pipelines:

  - id: notification-pipeline
    name: "Auto-Notification Pipeline"
    role: "Fires on new blog post commits. GitHub Action → Vercel serverless function → Discord webhook + X API + Facebook Graph API."
    components:
      - github          # .github/workflows/notify-new-post.yml
      - vercel          # api/post-deploy-notify.js
      - pythonanywhere  # /api/v1/progress/last-notified/ (marker endpoint)
      - discord         # Webhook
      - x-twitter       # OAuth 1.0a post
      - facebook        # Graph API post
    trigger: "Push to src/posts/*.md on main branch"
    manual_fallback: "tools/notify.ps1 (PowerShell)"
    status: operational
    last_verified: "2026-04-08"
    notes: "NOTIFY_SECRET shared between Vercel env vars, GitHub Secrets, and tools/notify.ps1. Rotated April 4, 2026."

  - id: music-production-pipeline
    name: "Music Production Pipeline"
    role: "End-to-end music creation from composition through distribution."
    components:
      - suno            # Initial generation
      - ace-studio      # MIDI vocal refinement (Powner Method)
      - audacity        # Editing and assembly
      - masterchannel   # AI mastering
      - distrokid       # Streaming distribution
      - cloudflare      # R2 CDN upload for website playback
    status: operational
    last_verified: "2026-04-11"

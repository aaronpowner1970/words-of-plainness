<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="vtitle vdesc">
  <title id="vtitle">Reason and Spirituality — Two Halves of a Whole</title>
  <desc id="vdesc">A Venn diagram. The left circle, Reason, contains objective evidence, logical analysis, scientific methods, and rational cognition. The right circle, Spirituality, contains subjective evidence, inspired insights, spiritual methods, and spiritual intuition. The overlap describes how the two complete each other: deeper understanding of truth, complementary perspectives on moral and ethical issues, reason interpreting revelation, and revelation opening new avenues for reasoned inquiry.</desc>

  <defs>
    <radialGradient id="reasonFill" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2E6F7E" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#1B4A55" stop-opacity="0.52"/>
    </radialGradient>
    <radialGradient id="spiritFill" cx="65%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#A8703A" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#6E4520" stop-opacity="0.52"/>
    </radialGradient>
    <style>
      .ground   { fill: #1A120B; }
      .title    { fill: #F5E6D0; font-family: 'Crimson Pro', Georgia, 'Times New Roman', serif; font-size: 38px; font-weight: 600; text-anchor: middle; }
      .subtitle { fill: #C4943A; font-family: 'Crimson Pro', Georgia, serif; font-size: 19px; font-style: italic; text-anchor: middle; letter-spacing: .04em; }
      .lobe     { fill: #C4943A; font-family: 'Crimson Pro', Georgia, serif; font-size: 31px; font-weight: 600; text-anchor: middle; }
      .item     { fill: #F5E6D0; font-family: 'Crimson Pro', Georgia, serif; font-size: 20px; text-anchor: middle; }
      .item-hi  { fill: #E8C87E; font-family: 'Crimson Pro', Georgia, serif; font-size: 20px; font-weight: 600; text-anchor: middle; }
      .mid      { fill: #EFE0C8; font-family: 'Crimson Pro', Georgia, serif; font-size: 14.5px; text-anchor: middle; }
      .foot     { fill: #8C7B63; font-family: 'Crimson Pro', Georgia, serif; font-size: 13px; text-anchor: middle; font-style: italic; }
      .ring     { fill: none; stroke-width: 1.6; }
    </style>
  </defs>

  <rect class="ground" x="0" y="0" width="1200" height="800"/>

  <text class="title" x="600" y="58">Reason and Spirituality</text>
  <text class="subtitle" x="600" y="90">Two Halves of a Whole &#8212; a holistic epistemology</text>

  <!-- circles -->
  <circle cx="450" cy="420" r="280" fill="url(#reasonFill)"/>
  <circle cx="750" cy="420" r="280" fill="url(#spiritFill)"/>
  <circle class="ring" cx="450" cy="420" r="280" stroke="#4E97A8" stroke-opacity="0.55"/>
  <circle class="ring" cx="750" cy="420" r="280" stroke="#C4943A" stroke-opacity="0.55"/>

  <!-- left lobe: Reason -->
  <text class="lobe" x="328" y="336">Reason</text>
  <text class="item" x="328" y="396">Objective Evidence</text>
  <text class="item" x="328" y="438">Logical Analysis</text>
  <text class="item" x="328" y="480">Scientific Methods</text>
  <text class="item" x="328" y="522">Rational Cognition</text>

  <!-- right lobe: Spirituality -->
  <text class="lobe" x="872" y="336">Spirituality</text>
  <text class="item" x="872" y="396">Subjective Evidence</text>
  <text class="item" x="872" y="438">Inspired Insights</text>
  <text class="item" x="872" y="480">Spiritual Methods</text>
  <text class="item-hi" x="872" y="522">Spiritual Intuition</text>

  <!-- overlap -->
  <text class="mid" x="600" y="327">Can lead to deeper</text>
  <text class="mid" x="600" y="346">understanding of truth.</text>

  <text class="mid" x="600" y="385">Complementary perspectives</text>
  <text class="mid" x="600" y="404">on moral and ethical issues.</text>

  <text class="mid" x="600" y="443">Reason can help interpret</text>
  <text class="mid" x="600" y="462">and understand revelation.</text>

  <text class="mid" x="600" y="501">Revelation can open new</text>
  <text class="mid" x="600" y="520">avenues for reasoned inquiry.</text>

  <text class="foot" x="600" y="756">Words of Plainness &#183; &#8220;Spiritual intuition&#8221; per Chapter 3, <tspan font-style="normal">Academic Knowledge</tspan> &#8212; the fifth faculty, whose source is not human reasoning.</text>
</svg>

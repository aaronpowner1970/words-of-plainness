name: Lantern Manifest

# Runs the Lantern Post source gate on GitHub and publishes its output to the
# lantern-manifest branch, so the unattended drafting task can read it without
# executing repo code. Triggers on main only, never on lantern-manifest itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lantern-manifest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production-equivalent)
        run: node tools/lantern/sources.mjs build

      - name: Manifest
        run: node tools/lantern/sources.mjs manifest

      - name: Test
        run: node --test tools/lantern/test/sources.test.mjs

      - name: Publish to lantern-manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/pub"

          # Prepare the publish worktree: existing branch, or a new orphan.
          if git ls-remote --exit-code --heads origin lantern-manifest >/dev/null 2>&1; then
            git fetch --depth 1 origin lantern-manifest
            git worktree add --detach "$PUB" FETCH_HEAD
          else
            git worktree add --detach "$PUB" HEAD
            git -C "$PUB" checkout --orphan lantern-manifest
            git -C "$PUB" rm -rf --quiet .
          fi

          # Keep the previous files (if any) to detect real changes.
          mkdir -p "$RUNNER_TEMP/prev"
          cp -f "$PUB"/manifest.json "$PUB"/published-urls.txt "$PUB"/meta.json "$RUNNER_TEMP/prev/" 2>/dev/null || true

          # Build the four files.
          node --input-type=module - "$PUB" "$RUNNER_TEMP/prev" <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          const [pub, prev] = process.argv.slice(2);
          const raw = fs.readFileSync('.lantern/manifest.json', 'utf8');
          const mf = JSON.parse(raw);
          const urls = mf.pages.map((p) => p.url).sort();
          const meta = {
            sourceCommit: process.env.SOURCE_SHA,
            generatedAt: new Date().toISOString(),
            publishedCount: mf.pages.length,
            mediaCount: mf.media.length,
            workflowRun: process.env.RUN_URL,
          };
          const readme = [
            'This branch holds the Lantern Post source-gate output (the manifest of published pages and media) for the commit named in meta.json.',
            'It is generated by the Lantern Manifest GitHub Actions workflow on every push to main.',
            'Never edit this branch by hand; the next run overwrites it.',
            '',
          ].join('\n');
          const manifestText = JSON.stringify(mf, null, 1);
          const urlsText = urls.join('\n') + '\n';

          // Unchanged = same source commit, same manifest apart from its own
          // timestamp, same URLs. Then write nothing, so git sees no change.
          let same = false;
          try {
            const old = JSON.parse(fs.readFileSync(path.join(prev, 'manifest.json'), 'utf8'));
            const oldMeta = JSON.parse(fs.readFileSync(path.join(prev, 'meta.json'), 'utf8'));
            const oldUrls = fs.readFileSync(path.join(prev, 'published-urls.txt'), 'utf8');
            const strip = (m) => JSON.stringify({ ...m, generated: undefined });
            same = oldMeta.sourceCommit === meta.sourceCommit && strip(old) === strip(mf) && oldUrls === urlsText;
          } catch { /* first run or unreadable previous files: publish */ }
          if (same) { console.log('unchanged: keeping previous files'); process.exit(0); }

          fs.writeFileSync(path.join(pub, 'manifest.json'), manifestText);
          fs.writeFileSync(path.join(pub, 'published-urls.txt'), urlsText);
          fs.writeFileSync(path.join(pub, 'meta.json'), JSON.stringify(meta, null, 2) + '\n');
          fs.writeFileSync(path.join(pub, 'README.md'), readme);
          console.log(`prepared: ${meta.publishedCount} pages, ${meta.mediaCount} media`);
          EOF

          cd "$PUB"
          git add -A
          if git diff --cached --quiet; then
            echo "No change; nothing to publish."
            exit 0
          fi
          ls -A | grep -v '^\.git$' | sort
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lantern manifest for ${SOURCE_SHA}"
          git push origin HEAD:refs/heads/lantern-manifest

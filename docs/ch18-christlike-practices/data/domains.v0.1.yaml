version: '0.1'
status: developmental
domains:
- id: attentive-presence
  title: Attentive Presence
  description: Notice the person before you and remain present to their need.
  behavioral_center: How Jesus notices, approaches, listens to, remains with, protects, and follows up with particular people.
  primary_question: What happens to my attention when a real person interrupts my plans?
  sort_order: 1
- id: dignity-belonging
  title: Dignity & Belonging
  description: Cross boundaries, protect dignity, welcome outsiders, and restore belonging.
  behavioral_center: How Jesus treats excluded, stigmatized, vulnerable, socially distant, or ideologically different people.
  primary_question: Whose dignity, belonging, or contribution do I instinctively discount?
  sort_order: 2
- id: truth-agency
  title: Truth & Agency
  description: Speak truth without manipulation and respect another person’s freedom.
  behavioral_center: How Jesus tells truth, asks questions, refuses manipulation, respects choice, receives counterargument,
    and chooses when to engage or withdraw.
  primary_question: Can I remain truthful without coercing another person or needing to win every encounter?
  sort_order: 3
- id: grace-restoration
  title: Grace & Restoration
  description: Continue loving, forgiving, teaching, and calling people who fail.
  behavioral_center: How Jesus responds to sin, failure, doubt, slowness, betrayal, and the possibility of return.
  primary_question: What do I do when another person’s incompleteness becomes inconvenient?
  sort_order: 4
- id: humility-inner-government
  title: Humility & Inner Government
  description: Govern desire, emotion, recognition, habits, and dependence upon God.
  behavioral_center: How Jesus governs Himself, seeks God, handles emotion, receives support, refuses acclaim, and resists
    performance.
  primary_question: What governs me when no other person is immediately responsible for my behavior?
  sort_order: 5
- id: peace-right-use-power
  title: Peace & Right Use of Power
  description: Respond to conflict, injury, hostility, and power as Jesus did.
  behavioral_center: How Jesus responds amid hostility, danger, retaliation, injustice, offense, and asymmetries of power.
  primary_question: What do I do with power when conflict arrives?
  sort_order: 6
- id: servanthood-stewardship
  title: Servanthood & Stewardship
  description: Meet needs, give generously, receive graciously, and handle resources responsibly.
  behavioral_center: How Jesus serves bodily and spiritual needs, handles abundance, values small offerings, receives care,
    and gives without requiring return.
  primary_question: Does my service make room for real needs, real limits, and the agency of both giver and receiver?
  sort_order: 7
- id: forming-others
  title: Forming Others
  description: Teach, empower, correct, affirm, protect, and help others grow capable.
  behavioral_center: How Jesus teaches, delegates, corrects, listens, affirms, protects, develops, and releases other people
    to act.
  primary_question: Do the people I influence become more capable, responsible, and free to serve?
  sort_order: 8

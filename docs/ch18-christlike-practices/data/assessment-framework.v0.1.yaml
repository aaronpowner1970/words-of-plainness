version: '0.1'
status: developmental_not_psychometrically_validated
purpose: Optional behavioral discernment aid that suggests two domains for exploration while preserving user agency.
response_scale:
- rarely
- sometimes
- often
- usually
- not_applicable_or_unsure
presentation_notes:
- Hide domain labels while answering.
- Prefer situational behavior over abstract trait self-rating.
- Recommend two possible growth focuses, not one diagnosis.
- Always allow the user to choose any domain instead.
- Do not describe results as validated unless formal validation is later performed.
items:
- id: A01
  domain: attentive-presence
  prompt: When someone begins telling me something important at an inconvenient time, I usually give them my attention before
    deciding what needs to happen next.
  direction: positive
- id: A02
  domain: attentive-presence
  prompt: After helping someone through an immediate problem, I usually remember to check later whether they still need support.
  direction: positive
- id: A03
  domain: attentive-presence
  prompt: When I try to help, I make a point of checking whether my help actually improved the situation.
  direction: positive
- id: B01
  domain: dignity-belonging
  prompt: I can welcome and learn from someone whose background, status, or beliefs make them socially distant from me.
  direction: positive
- id: B02
  domain: dignity-belonging
  prompt: When a person is being dismissed or stigmatized, I am willing to protect their dignity even if others disapprove.
  direction: positive
- id: B03
  domain: dignity-belonging
  prompt: When someone outside my group does something genuinely good, I can recognize it without first needing to qualify

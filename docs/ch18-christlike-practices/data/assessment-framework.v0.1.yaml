  direction: positive
- id: C01
  domain: truth-agency
  prompt: I can tell someone a difficult truth without trying to control the decision they make afterward.
  direction: positive
- id: C02
  domain: truth-agency
  prompt: When a discussion becomes manipulative or fruitless, I can refuse the argument or step away without needing the

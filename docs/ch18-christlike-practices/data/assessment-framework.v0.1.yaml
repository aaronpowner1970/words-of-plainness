- id: E02
  domain: humility-inner-government
  prompt: When I am distressed, I can acknowledge what I feel while still choosing my next action deliberately.
  direction: positive
- id: E03
  domain: humility-inner-government
  prompt: I make room for private prayer, reflection, or withdrawal before exhaustion and pressure determine my behavior for

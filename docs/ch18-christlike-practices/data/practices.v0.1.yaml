- id: CDP-012
  legacy_number: 12
  title: Questions That Honor the Soul
  descriptor: Inviting people to name desire, understanding, and conviction for themselves
  primary_domain: attentive-presence
  secondary_domains:
  - forming-others
  evidence_strength: enacted
  evidence:
  - reference: Mark 10:51
    type: enacted_or_taught_context
  - reference: Mark 8:29
    type: enacted_or_taught_context
    note: Parallel Matthew 16:15.
  - reference: John 5:6
    type: enacted_or_taught_context
    note: '"Wilt thou be made whole?" — consent asked of a man infirm thirty-eight years.'
  - reference: Luke 24:17-19
    type: enacted_or_taught_context
    note: The risen Lord asked, and heard their whole sorrow out, before opening the scriptures.
  - reference: John 20:15
    type: enacted_or_taught_context
    note: '"Woman, why weepest thou? whom seekest thou?"'
  - reference: John 21:15-17
    type: enacted_or_taught_context
    note: '"Lovest thou me?" thrice — shared scene with CDP-013 (restorative mercy); the lens here is the question''s function.'
  textual_or_editorial_note: No textual-critical issues.
  audit:
    date: '2026-08-09'
    strength_confirmed: enacted
    seed_references_verified: true
    references_added:
    - John 5:6
    - Luke 24:17-19
    - John 20:15
    - John 21:15-17
    notes: Seed carried two questions; the additions establish the questioning habit across all four Gospels and the resurrection narratives.
  card:
    what_jesus_did: |
      To a blind man whose need was plain to every onlooker, He said: "What wilt thou that I should do unto thee?" (Mark 10:51). To a man lying infirm beside a pool famous for healing: "Wilt thou be made whole?" (John 5:6). To His own disciples, after the crowd's opinions had been reported: "But whom say ye that I am?" (Mark 8:29). To a weeping woman at the garden tomb — He whom she sought: "Woman, why weepest thou? whom seekest thou?" (John 20:15). To two disciples fleeing Jerusalem with broken hopes, walking beside them unrecognized: "What manner of communications are these that ye have one to another, as ye walk, and are sad?" (Luke 24:17-19) — and He heard their whole sorrow out before He opened the scriptures to their understanding. And to Peter, three times on the shore: "Lovest thou me?" (John 21:15-17).

      Observe what these questions share: He did not need the answers. He asked, not to learn, but to allow the person before Him the dignity of naming their own desire, own their own faith, speak their own grief, and choose. He knocked at the door of their souls instead of forcing His way in.
    how_we_practice: |
      This discipleship practice is to ask before we assume, prescribe, or fix — and then to wait patiently and listen for the answer. "What would you like me to do for you?" is a sentence a disciple can carry into every room: the home, the classroom, the church hallway, the workplace. It must be a real question — not a leading question, not a quiz with one approved answer, not a setup for advice already composed. Asked honestly, it moves the naming of the need from the helper to the one being helped, which is where it belongs.

      And there are deeper questions in the Lord's pattern — questions that invite a person to say aloud what they believe, whom they seek, and whom they love. Those questions are not information-gathering. They are doorways thrown open so the individual may choose to enter.
    how_it_blesses_lives: |
      People flourish as free agents and wither as personal projects. The person who is asked — and heard — keeps ownership of their own life, faith, and repentance; the person who is merely diagnosed and fixed learns either to be passive or to hide. The disciple is blessed as well, for honest questions reveal the actual need, which is so often not the assumed one. And some answers change the person who speaks them: Peter's threefold "thou knowest that I love thee" (John 21:15-17) did more in Peter’s heart than any sermon could have done.
    suggested_actions:
    - This week, when someone brings you a problem, ask "What would you like me to do for you?" before offering anything — then do that, rather than what you had planned.
    - In one significant conversation, ask three honest questions before making one statement.
    - Ask someone you love a question about their soul — what they hope, what they believe, what they grieve — and receive the answer without correcting or improving it.
    - In your ministering, replace one assumption ("they need a meal") with one question ("what would help most right now?") — and act on the answer.
    reflection_prompts:
    - Do my questions open doors, or drive others toward my conclusions?
    - Whose needs have I assumed instead of asked?
    - What question is the Lord asking me right now — and have I answered Him aloud?

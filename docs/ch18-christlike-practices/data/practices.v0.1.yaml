practices:
- id: CDP-001
  legacy_number: 1
  title: Attentiveness to the Individual
  descriptor: Stopping for the one amid the many
  primary_domain: attentive-presence
  secondary_domains:
  - dignity-belonging
  evidence_strength: enacted
  evidence:
  - reference: Mark 10:46-52
    type: enacted_or_taught_context
  - reference: Mark 5:25-34
    type: enacted_or_taught_context
  - reference: Luke 8:43-48

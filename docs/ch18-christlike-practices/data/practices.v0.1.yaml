- id: CDP-036
  legacy_number: 36
  title: Privacy-Preserving Care
  descriptor: Protecting another person’s vulnerability from becoming spectacle
  primary_domain: attentive-presence
  secondary_domains:
  - dignity-belonging
  evidence_strength: enacted
  evidence:
  - reference: Mark 7:33-36
    type: enacted_or_taught_context
    note: '"He took him aside from the multitude" — shared scene with CDP-004 (contact lens there; privacy lens here).'
  - reference: Mark 8:22-26
    type: enacted_or_taught_context
    note: Led out of the town before healing; sent home afterward, not back into the town.
  - reference: Mark 5:37-43
    type: enacted_or_taught_context
    note: Witnesses limited to three; the wailing crowd put out; parents charged straitly that no man should know.
  textual_or_editorial_note: 'Two flags. (1) Textual: the closing clause of Mark 8:26 ("nor tell it to any in the town") varies among ancient manuscripts; the practice rests on verse 23 (leading the man
    out of the town), which is textually secure. (2) Interpretive: scholarship discusses Jesus'' commands of silence under the "messianic secret"; the behavioral observation — He repeatedly removed vulnerable
    people from the crowd''s gaze before ministering to them — stands independent of that discussion and the card makes only the behavioral claim.'
  audit:
    date: '2026-08-09'
    strength_confirmed: enacted
    seed_references_verified: true
    references_added: []
    notes: Seed references verified and sufficient; all three anchors are Markan (the aside-taking detail is distinctive to Mark), which is acceptable — three independent episodes within one Gospel constitute
      a pattern, and Mark 5:37-43 has Synoptic support (Luke 8:51-56).
  card:
    what_jesus_did: |
      They brought Him a man who was deaf and had an impediment in his speech, and the crowd stood ready to watch the spectacle. "And he took him aside from the multitude" (Mark 7:33-36) — and there, away from the eyes, healed him. At Bethsaida they brought a blind man, and He "took the blind man by the hand, and led him out of the town" before healing him, and afterward sent him to his own house, saying, "Neither go into the town" (Mark 8:22-26). In the house of Jairus He "suffered no man to follow him, save Peter, and James, and John," put the wailing crowd out entirely, raised the dead child with only her parents and three witnesses present, "and charged them straitly that no man should know it" (Mark 5:37-43).

      A man's deafness, a man's blindness, a family's rawest grief and greatest joy — none of it became a public show. Whatever else His charges of silence accomplished, their observable effect was that the vulnerable person was shielded at their most exposed moment. He arranged the scene around their dignity.
    how_we_practice: |
      The practice is to guard other people's vulnerable moments as carefully as Jesus guarded them. Correction happens aside, not before an audience — including with our own children. Confidences remain kept and carefully guarded. The struggling person is offered a private place to speak or weep — a walk, a drive, a closed door: an "aside from the multitude."

      In our day the practice has a sharpened edge: we do not convert another person's crisis into media content. Their diagnosis, their wayward child, their marriage troubles, their repentance — none of it is ours to narrate or spread as gossip, even in the sympathetic register of a public prayer request, without their consent. Anonymous acts of Christlike service shield their weaknesses from public shame and preserve their dignity.
    how_it_blesses_lives: |
      Safety produces honesty. People carry their wounds to those who will not display them, and they carry them away from those who will. Where this discipleship practice lives, struggling souls confess earlier, the grieving weep freely, and repentance can begin in private before it must be lived in public. And the one who is shielded keeps something precious: a dignity that survives the crisis intact, so that when they rejoin the multitude, their story remains their own to tell.
    suggested_actions:
    - If you must correct or counsel someone this week, take them aside — never in front of others, and never in front of the family audience at home.
    - 'Audit what you share: before repeating any story about another person''s hardship — including as a prayer request — obtain their consent, or keep silence.'
    - Create an "aside from the multitude" for someone who is struggling — a walk, a drive, a closed door — where they can speak without witnesses.
    - Choose one confidence you have been tempted to repeat, and bury it for good.
    reflection_prompts:
    - Who has trusted me with a vulnerable moment — and did I guard it or spend it?
    - When I help someone, who else ends up knowing, and why do they know?
    - Would the people I serve say that being helped by me is safe?

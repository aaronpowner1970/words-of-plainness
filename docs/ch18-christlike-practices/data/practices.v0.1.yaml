- id: CDP-049
  legacy_number: 49
  title: Fellowship Across Disagreement
  descriptor: Maintaining relationship and table fellowship without pretending agreement
  primary_domain: dignity-belonging
  secondary_domains:
  - truth-agency
  evidence_strength: enacted
  evidence:
  - reference: Luke 7:36
    type: enacted_or_taught_context
    note: 'The first of three recorded Pharisee tables — accepted from a host whose contempt surfaces mid-meal.'
  - reference: Luke 11:37
    type: enacted_or_taught_context
    note: 'A second Pharisee''s table — accepted after public conflict with Pharisees, and the critique delivered at the table itself.'
  - reference: Luke 14:1
    type: enacted_or_taught_context
    note: 'A chief Pharisee''s table, on the sabbath, while "they watched him" — fellowship sustained under surveillance.'
  - reference: Mark 2:15-17
    type: enacted_or_taught_context
    note: 'The other side of the same table habit — publicans and sinners, over the religious establishment''s objection. Shared scene with CDP-003 and CDP-014.'
  textual_or_editorial_note: 'No textual-critical issues. The three Pharisee meals are distinctly Lukan but are three independent episodes, not parallels — a genuine pattern within one Gospel, corroborated in kind by Mark 2:15-17 on the opposite social flank. Editorial caution honored from the seed descriptor: the card must not soften the fact that He criticized His hosts at their own tables — the practice is fellowship without pretended agreement, not politeness.'
  audit:
    date: '2026-08-10'
    strength_confirmed: enacted
    seed_references_verified: true
    references_added: []
    notes: 'All four seed references verified and sufficient; none added. The audit sharpened the claim instead: He kept table fellowship with both flanks of every argument about Him — Pharisees who suspected Him and sinners the Pharisees despised — and in neither company did He trim His words to keep His seat. Author edit (Aug 17): witness filled (interfaith ministry testimony); Mosiah 18:21 framing generalized to “At baptism a group of believers” in the application section, citation retained.'
  card:
    what_jesus_did: |
      Three times Luke records that Jesus went to dinner at a Pharisee's house — and by the second one, the Pharisees were already His open critics. "And one of the Pharisees desired him that he would eat with him. And he went into the Pharisee's house, and sat down to meat" (Luke 7:36). Later, "a certain Pharisee besought him to dine with him: and he went in, and sat down to meat" (Luke 11:37). Later still, "he went into the house of one of the chief Pharisees to eat bread on the sabbath day," while "they watched him" (Luke 14:1). Watched, suspected, tested — and still at their tables. The Master did not require agreement as the price of His company.

      Neither did He purchase His seat with silence. In Simon's house He told His host, to his face, a parable about his own thin hospitality (Luke 7:44-47). At the second table, when His host marvelled that He had not first washed, the Lord answered with a searching critique of Pharisaic tradition — delivered from the guest's couch, not shouted from a safe distance (Luke 11:38-44). At the third, under the watchers' eyes, He healed a man with the dropsy, defended the healing, and then counseled His host about whom to invite to feasts (Luke 14:2-14). The fellowship was real, and so was the disagreement, and He never sacrificed either one to preserve the other.

      And all the while, the other flank murmured for the opposite reason: He kept table fellowship with publicans and sinners too. "And it came to pass, that, as Jesus sat at meat in his house, many publicans and sinners sat also together with Jesus and his disciples" (Mark 2:15-17). Watch the whole pattern at once and the wonder of it appears: every party in Israel's arguments could find Him at the table of their opponents. He belonged to none of the camps, and He ate with all of them.
    how_we_practice: |
      Fellowship across lines of disagreement is the discipleship practice of staying at the table — of refusing to let a real difference in belief, politics, or way of life end the meal, the friendship, or the family bond. Our age has largely lost this art. We increasingly eat, worship, and live only with those who agree with us. And the people we differ with are made into enemies and cancelled social pariahs, devolving into abstractions we argue about rather than faces we break bread with. The Lord's pattern rebukes the sorting: He dined with the very men whose theology He publicly opposed, and with the very sinners whose lives He came to change.

      The practice has two disciplines, and both are required. The first is presence: accept the invitation, extend the invitation, keep the relationship in repair across the disagreement — "If it be possible, as much as lieth in you, live peaceably with all men" (Romans 12:18). The second discipline is honesty: we do not buy our seat at the table by pretending. At baptism a group of believers covenanted to have "their hearts knit together in unity and in love one towards another" (Mosiah 18:21) — and hearts cannot be knit by concealment. Christlike fellowship neither weaponizes the truth nor retires it; it speaks as Jesus spoke at Simon's table, plainly and without leaving.

      My own experiences with interfaith ministry bear this out. I have often marveled that a discussion attended by varieties of Christians, Jews, Muslims, atheists, agnostics, and skeptics can often sit together and discuss the desire to pursue goodness and neighborly compassion in peaceful communities despite irreconcilable differences. The difference is the willingness to stay at the table and listen to one another without taking offense and resisting the urge to expect conformity.
    how_it_blesses_lives: |
      The person across the lines of disagreement receives what argument alone can never deliver: the discovery that they are loved as a person and not merely engaged as a position or policy. Family bonds survive hard seasons; friendships outlast elections; a neighbor of another faith learns that our convictions and our welcome arrive together. And the disciple is blessed with what the sorted life forfeits — truth tested in real company, affection that does not depend on victory, and the credibility that only an open and welcoming table confers. When we finally speak of Christ to a friend, the years of shared meals speak with us. Whose table have I quietly stopped sharing because agreeing became too hard — and what might one renewed invitation restore?
    suggested_actions:
    - Renew one table you have let lapse over a disagreement — a family member, an old friend — and go with no agenda but the meal.
    - Accept the next invitation from someone whose beliefs differ sharply from yours, and be a warm, honest guest — neither combative nor concealed.
    - When conversation at a shared table turns to the disagreement, practice the Lord's order — relationship first, honesty within it — and stay seated to the end.
    - Host a meal that mixes company your social circles would normally keep apart, and let the table do quiet work no argument could.
    reflection_prompts:
    - Whom have I unfriended, uninvited, or quietly avoided over a disagreement — and would the Lord have left that table?
    - When I differ, do I pretend, withdraw, or attack? What would speaking-while-staying look like?
    - Can the people who disagree with me still feel certain of my love?

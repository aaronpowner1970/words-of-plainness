  textual_or_editorial_note: 'No textual-critical issues. The Gadarene narrative involves the well-known place-name variation (Gadarenes/Gerasenes/Gergesenes) among manuscripts and Synoptics; it does not affect the practice claim. Behavior-first note: the claim that "Daughter," "daughter of Abraham," and "son of Abraham" functioned as public restoration is grounded in the narrative settings (a pressing crowd, a synagogue, a murmuring city) — each name was conferred before witnesses.'
  audit:
    date: '2026-08-10'
    strength_confirmed: enacted
    seed_references_verified: true
    references_added:
    - Mark 1:40-45
    - Luke 17:11-19
    - Mark 5:1-20
    notes: 'All three seed anchors verified. The additions supply the practice''s second half: alongside the names of belonging (seed), He used the community''s own readmission protocols (the priestly certification) and direct sending-home to return people to the places that had excluded them. Restoration in the record is communal, not merely private. Author edit (Aug 17): witness filled (first-person; the back-door welcome).'
  card:
    what_jesus_did: |
      Healing removed people's afflictions. Watch closely, and again and again the Savior added something the healing alone did not supply: He gave people back their place.

      A woman who had suffered an issue of blood — twelve years ceremonially unclean, twelve years untouchable in the eyes of her neighbors — anonymously touched the Savior’s garment in the crowd and was healed. He stopped, found her, and gave her a name no physician could confer: "Daughter, thy faith hath made thee whole; go in peace, and be whole of thy plague" (Mark 5:34). Daughter — spoken before the pressing crowd that had long known what she was. In a synagogue, over a woman bowed together eighteen years, He pronounced her standing to the congregation that had watched her all that time: "ought not this woman, being a daughter of Abraham... be loosed from this bond on the sabbath day?" (Luke 13:16). And over Zacchaeus, while Jericho murmured, the Lord declared: "This day is salvation come to this house, forsomuch as he also is a son of Abraham" (Luke 19:9). Also a son of Abraham — the "also" restores him to the family the city had read him out of.

      When the community kept a formal door, He used it. To the cleansed leper: "shew thyself to the priest, and offer for thy cleansing those things which Moses commanded, for a testimony unto them" (Mark 1:40-45) — the priestly examination was the legal instrument by which a leper reentered Israel's camp, and Jesus sent him straight to it. Ten lepers together received the same routing: "Go shew yourselves unto the priests" (Luke 17:11-19). And the man of the tombs, who had lived in chains among the dead, begged to stay with his Healer; Jesus sent him home instead: "Go home to thy friends, and tell them how great things the Lord hath done for thee" (Mark 5:1-20). We can infer that home — the very community that had bound him — was where his restoration had to finish, or it would never be whole.
    how_we_practice: |
      Restoring belonging is the discipleship practice of completing what forgiveness and recovery begin. When a person carries a stigma — a past offense, a public failure, an addiction in remission, a prodigal season, a divorce, an incarceration, a long absence from the pews — our communities too often extend a technical welcome and an actual distance. The person is allowed back. They are not brought back. This practice closes that last, coldest mile.

      It works the way the record shows: by names and by roles. We speak the restoring names out loud and in public — brother, sister, friend, one of us — where the old labels used to live. We give the returning soul a place at the table and, soon, work to do in the body of Christ, for Paul taught the Ephesians that the gospel makes former outsiders "no more strangers and foreigners, but fellowcitizens with the saints, and of the household of God" (Ephesians 2:19). Fellow citizens — not probationary residents. And the risen Lord commanded His Nephite disciples concerning those who had strayed: "ye shall not cast him out of your synagogues, or your places of worship, for unto such shall ye continue to minister; for ye know not but what they will return and repent" (3 Nephi 18:32). The ministering continues because the door must be found open at the very moment courage finally comes.

      It is hard enough for those who cannot hide from public scrutiny — a divorced spouse returning to church alone, one whose sins have become the focus of community gossip, those marked by former choices like tattoos, a poor family that cannot afford proper church clothes for their children, a young couple struggling with noisy toddlers — to gather with their community in worship. I have felt tremendous relief at a kind face turning my direction as I open the back doors to a chapel, then waiving to empty seats near them. A quiet handshake and a smiling face means much to a nervous heart.
    how_it_blesses_lives: |
      For those restored to fellowship, a sense of belonging is the healing after the healing. Sins can be forgiven and habits conquered while the soul still eats alone; the restoring welcome, spoken where the neighbors can hear it, finishes what mercy started. Families receive their members back whole instead of on parole. Congregations are blessed doubly, for a community known to restore its wounded becomes a safe place to be wounded in. And confession, repentance, and return all quicken where the ending is known to be a seat at the table rather than a permanent asterisk or scarlet letter. The Good Shepherd carries the sheep all the way back to the fold, not merely out of the ravine.
    suggested_actions:
    - 'Think of someone who has returned — to church, to the family, to sobriety — and publicly give them a restoring name this week: introduce them warmly, sit beside them, claim them as yours.'
    - If you hold a calling or any influence, help place a returning soul into real responsibility — a role, an assignment, a trust — not merely a pew.
    - Retire one old label from your vocabulary ("the less-active family," "the ex-," "the one who...") and replace it with the person's name.
    - Mark the calendar for the vulnerable second month of someone's return, when the novelty of welcome fades — and be present in it.
    reflection_prompts:
    - Who in my circle has been allowed back but never brought back?
    - What names do I use for people in their absence — the restoring ones, or the old ones?
    - When I returned from my own far country, who spoke the word that made it home again?

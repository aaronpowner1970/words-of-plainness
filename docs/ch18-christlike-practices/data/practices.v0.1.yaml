    note: Synoptic parallel to Mark 5; adds "the multitude throng thee" contrast (Luke 8:45).
  textual_or_editorial_note: 'No textual-critical issues. Synoptic parallels diverge on detail (Matthew 20:29-34 has two blind men; Luke 18:35-43 places the healing at the approach to Jericho): Mark''s
    Bartimaeus account is the primary anchor; parallels need not be cited on the card.'
  audit:
    date: '2026-08-09'
    strength_confirmed: enacted
    seed_references_verified: true

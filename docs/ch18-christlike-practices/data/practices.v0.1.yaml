  card:
    what_jesus_did: |
      The Messiah was on the road to Jerusalem — the most consequential journey ever undertaken — when He passed again through Jericho, but for the last time. There, in a sycamore tree, sat a man whom everyone else in that city despised. Jesus did not simply toss blessing his direction in passing. Rather, He stopped beneath the tree, calling him by name, "Zacchaeus, make haste, and come down; for to day I must abide at thy house" (Luke 19:1-10). Abide. He gave the man more than a moment; a shared meal, an honored guest for his home, the rest of the day — and salvation came to that house before He left it.

      At Jacob's well, wearied with His journey, He sat, and a simple request for water became a conversation that transformed a woman's life; and when the Samaritans of that city besought Him to tarry, "he abode there two days" (John 4:6; John 4:40). Two days, in Samaria, for people His nation refused to greet. And remember the road to Jairus's house: with a child dying ahead of Him, He stood still and heard a trembling woman tell "all the truth" — twelve years of it (Mark 5:25-34).

      The Gospels record no scene in which Jesus behaves as a hurried man, dismissing others in His wake. His pace bent to persons; persons were not bent to His pace.
    how_we_practice: |
      Unhurried presence is the practice of giving people the gift of time — which, for most of us, is the costliest thing we own. Attentiveness (CDP-001) decides whether we stop; this discipleship practice decides how long we stay. Hurry is where a person’s worth gets erased: if we only greet them in passing, glance at the clock while they speak, and compose our exit while they are still speaking.

      The discipline begins with margins — routinely leaving room around our appointments so that the person in front of us never has to meet our hurry — and it can mature into abiding: staying for the meal, lingering at the table, letting the other person be the one to end the conversation.

      My own brother, Jim, has been an example of this practice in my life. He is ten years older than me. As the baby brother, it made my heart leap with joy whenever he paused to notice me or include me in his activities. Despite my present grandfatherly age, whenever Jim takes time from his very busy personal life to sit a while with me, it still makes me feel like I matter, that I belong somewhere in this world.
    how_it_blesses_lives: |
      People do not display their needs or pour out their hearts on a schedule. The shy speak their truth in the twentieth minute of the conversation, not in the first thirty seconds; the ashamed test us with small disclosures before trusting us with large ones; Zacchaeus's repentance surfaced over the course of an afternoon in his house, not in the instant beneath the tree (Luke 19:8). The unhurried disciple receives what the hurried disciple never learns was there, trust and opportunities to engage with the tender hearts and minds of others. And the practice blesses our own souls, for hurry is not merely a schedule problem but a heart posture — and abiding with people teaches us the pace at which love actually travels.
    suggested_actions:
    - This week, plan one visit with no end time — and let the other person be the one who concludes it.
    - Build fifteen minutes of margin ahead of your next three appointments, so that whoever is before you never has to meet your hurry.
    - At your next shared meal, be the last one to rise from the table.
    - When you catch yourself composing your exit from a conversation, silently pray for the person speaking — and stay five more minutes.
    reflection_prompts:
    - What would the people closest to me say my pace tells them about their worth?
    - Whose unfolding have I foreclosed because I greeted them in passing?
    - What am I actually protecting when I hurry?

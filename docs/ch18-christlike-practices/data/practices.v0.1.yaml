  - reference: John 4:28-30, 39
    type: enacted_or_taught_context
    note: 'The Samaritan woman as evangelist: "many of the Samaritans of that city believed on him for the saying of the woman." Shared scene with CDP-003 (boundary lens); here, the outsider becomes the witness.'
  - reference: Mark 5:18-20
    type: enacted_or_taught_context
    note: 'The healed man of the tombs commissioned to Decapolis — "tell them how great things the Lord hath done for thee." Shared with CDP-051 (sending-home lens); here, the herald''s role conferred.'

  textual_or_editorial_note: 'No textual-critical issues. The Zacchaeus narrative is Luke-only; the seeking pattern is independently anchored by Mark 2:15-17 and the double-tradition sheep parable (Luke 15:1-7; Matthew 18:12-14). Luke 15:8-10 (the lost coin) and 15:11-32 (the prodigal) extend the same teaching and may be cited at the editor''s discretion; the card keeps to the shepherd image.'
  audit:
    date: '2026-08-10'
    strength_confirmed: taught_and_enacted
    seed_references_verified: true
    references_added:
    - Luke 15:1-7
    - Matthew 18:12-14
    - Mark 2:15-17
    notes: 'Seed carried the saying alone (Luke 19:9-10). Verified and extended: the saying is the interpretation Jesus Himself gave of an enacted scene, and the parables plus Levi''s feast supply the taught dimension across two Gospels. Seeded grade confirmed exactly. Author edit (Aug 17): closing invitational question relocated from How It Blesses Lives to the reflection prompts (now four).'
  card:
    what_jesus_did: |
      The people of Jericho were shocked by the strange behavior of the Rabbi Jesus. He had stopped beneath the strange watcher perched in the branches of the sycomore tree and gone home with him, a man hated in the city, the one everyone agreed deserved isolation. "And when they saw it, they all murmured, saying, That he was gone to be a guest with a man that is a sinner." Jesus answered the murmuring with the plainest account He ever gave of His own ministry: "The Son of man is come to seek and to save that which was lost" (Luke 19:1-10). Not to receive the lost if they should happen to wander back. To seek them.

      The Teacher had drawn the same picture before, when Pharisees and scribes murmured the same complaint: "This man receiveth sinners, and eateth with them." He asked them: "What man of you, having an hundred sheep, if he lose one of them, doth not leave the ninety and nine in the wilderness, and go after that which is lost, until he find it?" (Luke 15:1-7). Until he find it. The shepherd in the parable does not call from the sheepfold gate and wait. He walks out into the wilderness, and the search has no expiration. And when Jesus told the parable again for the sake of the little ones, He grounded it in heaven itself: "Even so it is not the will of your Father which is in heaven, that one of these little ones should perish" (Matthew 18:12-14).

      His table told the same story as His parables. At Levi's house, surrounded by publicans and sinners, He answered the scribes' objection with a physician's logic: "They that are whole have no need of the physician, but they that are sick: I came not to call the righteous, but sinners to repentance" (Mark 2:15-17). The company He kept was not an accident of His ministry. It was the ministry.
    how_we_practice: |
      Seeking the lost is the practice of carrying welcome where it is not expected — of refusing to let "they know where to find us" stand in for the shepherd's determined walk into the wilderness. Every congregation, every family, and every circle of friends has its lost: the brother no one has seen in years, the sister who left hurt, the elder who felt unwelcome, the child who drifted into rebellion, the friend everyone quietly reclassified from "missing" to "gone." This discipleship practice keeps their names on the list and their faces in our prayers, and then it takes action from a place of sincerity.

      Going forth to redeem the lost or to reconcile the brokenhearted is often more humble than expected: knocking on a closed door, sending a message, a seat saved, an invitation renewed after the ninth polite decline. What makes it seeking rather than pestering is the spirit of the shepherd — we go because the person is precious, not because our numbers are down. They know the difference. The Lord declared in this dispensation, "Remember the worth of souls is great in the sight of God," and promised, "how great is his joy in the soul that repenteth!" (D&C 18:10-13). Ezekiel recognized the same divine trait in the voice of the God of Israel: "I will seek that which was lost, and bring again that which was driven away" (Ezekiel 34:16). Those who seek the lost and forgotten are doing what God does.

      The parable supplies a clear caution to shepherds of God’s fold. The sheep are never blamed for being lost, they are not dragged home unwillingly by the leg, nor lectured on the journey back. A lost sheep is carried joyfully upon the shoulders of the shepherd, and the carrying ends in a celebration, not a reckoning.
    how_it_blesses_lives: |
      Ask those who came back what brought them, and the answer is almost never a lecture or brilliant argument. It is almost always the persistent kindness of a person — someone who kept coming, kept writing, kept a place set at the table until the wandering soul began to believe the welcome was real. The lost souls discover they were never written off, which is often the one fact their hearts needed. And the seeker is blessed with the shepherd's own joy, a joy the ninety and nine cannot supply — the Lord said heaven itself feels it: "joy shall be in heaven over one sinner that repenteth, more than over ninety and nine just persons, which need no repentance" (Luke 15:7).
    suggested_actions:
    - Write down the name of one person who has drifted from your congregation, family, or friendship — and go to them this month, in person if any way possible.
    - Renew an invitation you stopped extending because it kept being declined; deliver it as warmly as the first time, with no ledger attached.
    - When a name comes up in conversation as "long gone," resist the past tense; say instead what the shepherd would say, and then act on it.
    - Pray for one lost sheep by name each day this week, and ask the Lord for one concrete errand toward them — then run it.
    reflection_prompts:
    - Whom have I quietly reclassified from "missing" to "gone"?
    - Whose name has quietly fallen off my list — and what would it mean to them to learn it never fell off His?
    - Does my welcome wait at the gate, or walk into the wilderness?
    - When I was the one lost — and every disciple has been — who came looking for me?

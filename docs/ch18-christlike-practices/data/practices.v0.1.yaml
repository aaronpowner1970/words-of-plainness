  card:
    what_jesus_did: |
      Jesus came to Bethany knowing exactly how the story would end. He had told the disciples plainly before the journey: "Our friend Lazarus sleepeth; but I go, that I may awake him out of sleep" (John 11:11). The solution was already in hand.

      Then Mary fell down at His feet, weeping, and all the mourners wept around her — and He "groaned in the spirit, and was troubled," asked to be shown the grave, and wept with them (John 11:32-38). The shortest verse in scripture — “Jesus wept” — describes a man minutes away from raising the dead. He did not say, "Dry your tears and watch." He entered the grief first — so fully that the bystanders said, "Behold how he loved him!" — and only then went to the tomb and called Lazarus forth.

      Note the two sisters. To Martha, who came with her theology engaged, He gave doctrine: "I am the resurrection, and the life" (John 11:25-26). With Mary, who fell at His feet in tears, He wept. The differing responses are the observable fact; that He met each mourner in her own need is the reading offered here, and a modest one. At Nain the same order holds: "When the Lord saw her, he had compassion on her" — entering into grief with the widow first, the miracle after (Luke 7:13-15).
    how_we_practice: |
      We covenant at baptism to "mourn with those that mourn,” to “comfort those that stand in need of comfort," and to “lift up the hands which hang down” (Mosiah 18:9; Hebrews 12:12) — and the order of those verbs is the order of this practice. Compassion comes before comforting and before action. The practice is to resist the reflex to solve, explain, or silver-line a grieving person, and to join them first: presence, tears, shared silence, quiet companionship, the willingness to be shown the grave.

      This is hardest — and matters most — when we genuinely carry love and hope. Our witness of the resurrection is true. And Jesus, who was Himself the resurrection, still wept. Doctrine has its season, but the day of tears asks first for company.
    how_it_blesses_lives: |
      The grieving are not left alone at the bottom. Pushing too fast for healing, or seeing grief as a lack of faith or strength are both damaging to the suffering soul. Pressuring mourners to manage their sorrow for the sake of our own comfort teaches them to grieve somewhere else. Shared grief does the opposite: it tells the mourner their loss is real, their tears are honorable, and they are loved in the place where they actually are. And our testimony of the resurrection loses nothing in the waiting; it gains power, because it has first wept. We wait patiently upon the Lord. We can wait patiently for our neighbor.

      When my precious mother died, little was more comforting than the presence of others who stood by me and mourned with me. The cycles of grief that slowly diminished in intensity with time were made meaningful by loved ones who permitted me to experience them fully and stayed close when I needed borrowed strength and patient acceptance.
    suggested_actions:
    - 'The next time someone shares a loss, say nothing instructive on the first visit: be present, mourn, listen — and save the doctrine for the day they ask for it.'
    - Strike "at least" from your comfort vocabulary this month; replace it with "tell me about them," or with shared silence.
    - Go bodily to the funeral, the hospital, the hard anniversary. Sit with the grieving where they are, as He asked to be shown the grave.
    - If you carry a grief of your own that you have been solving instead of feeling, bring it to the Lord who wept — and let someone mourn with you.
    reflection_prompts:
    - When someone weeps, what is my first reflex — presence, or repair?
    - Have I ever used true doctrine to avoid shared sorrow?
    - Who in my circle is in the fourth day of their grief — and have I gone to them?

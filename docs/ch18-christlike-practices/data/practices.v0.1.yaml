  card:
    what_jesus_did: |
      A leper came to Christ — a man whose disease made him untouchable by law and by custom, who had perhaps not felt a human hand since his sickness began. Jesus, "moved with compassion, put forth his hand, and touched him," and only then said, "I will; be thou clean" (Mark 1:40-45). The record is careful about the order: contact came before cure. We can infer that the compassionate touch was not necessary for the miracle. It was necessary for the man.

      And the innocent touch was not an exception; it was a habit. He took Peter's wife's mother by the hand (Mark 1:31). He put His fingers into the ears of a deaf man (Mark 7:33) and took a blind man by the hand to lead him out of the town (Mark 8:23). He laid His hands on a physically disabled woman (bowed together) eighteen years (Luke 13:13), touched the casket frame (bier) of a widow's dead son at Nain (Luke 7:14), took a convulsing boy by the hand and lifted him up (Mark 9:27), and took little children up in His arms, put His hands upon them, and blessed them (Mark 10:16). To person after person whom sickness, death, or custom had placed beyond arm's reach, He closed the distance bodily, a holy and compassionate presence.
    how_we_practice: |
      Holy touch or personal proximity is the practice of closing physical distance with dignity — appropriate, welcome, and wise. It means sitting beside the hospital bed rather than standing at its foot; the hand on the shoulder of the grieving; the handshake or embrace for the person whose circumstances make others step back; going to the house, the room, the bedside, instead of ministering from across town, or by text message. Often, presence comes before rescue; contact before cure.

      Social propriety and consent govern the practice — it is never license, and wisdom will shape what nearness looks like in each relationship and occasion. But within those bounds, the disciple refuses to let another person's affliction, age, appearance, or reputation make them untouchable.

      I remember the sting of loneliness when I lay within an oxygen tent on a hospital bed as a little boy with life-threatening asthma symptoms. My parents could not be with me every moment, and it frightened me to be in the cold and clinical environment all alone. A kind nurse noticed my distress and paused her scheduled rounds to pull up a chair to sit by my side and get to know me for a few minutes. She slid her hand under the plastic edge of the oxygen canopy to hold my own hand. To me, her smile was that of an angel. I was able to sleep, knowing she was near.
    how_it_blesses_lives: |
      The isolated suffer a hunger no sermon reaches. A touch, rightly given, tells a person they belong to the human family before one word is spoken and before anything about their circumstance has changed. The leper was cleansed by the word — but he was comforted by the hand. Healing restored his health, but the holy touch restored his humanity. And those who practice holy nearness find their own compassion becoming concrete: it is difficult to hold a person's hand and keep them categorized as a "problem to solve."
    suggested_actions:
    - Visit in person this week someone you have only texted, called, or thought about — and sit near, not across.
    - Offer an appropriate touch — a handshake held a moment longer, a pat on the shoulder, an innocent embrace — to someone whose circumstances cause others to keep their distance.
    - If someone you know is sick or confined, go to where they are; do not require them to come to where you are. Priesthood holders — offer a blessing, for hands laid on the head are holy touch by ordinance.
    - Notice one person this week whom your community quietly treats as untouchable, and greet them by name with your hand extended.
    reflection_prompts:
    - Whom do I care about from a safe distance?
    - What distances am I maintaining that Jesus would have crossed bodily?
    - When has another person's nearness carried God's love to me?

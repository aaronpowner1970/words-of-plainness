- id: CDP-059
  legacy_number: 59
  title: Taking Advocacy for Another Seriously
  descriptor: Receiving intercession by others on behalf of someone in need
  primary_domain: attentive-presence
  secondary_domains:
  - dignity-belonging
  evidence_strength: enacted
  evidence:
  - reference: Mark 2:3-5
    type: enacted_or_taught_context
    note: '"When Jesus saw their faith" — the faith of the four moved Him for the one.'
  - reference: Matthew 8:5-13
    type: enacted_or_taught_context
    note: The centurion for his servant.
  - reference: Luke 7:1-10
    type: enacted_or_taught_context
    note: Lukan account of the same healing, conducted entirely through emissaries — see harmonization note.
  - reference: Mark 5:22-24
    type: enacted_or_taught_context
    note: Jairus for his daughter — "And Jesus went with him."
  - reference: Mark 7:24-30
    type: enacted_or_taught_context
    note: The Syrophenician mother for her daughter; shared scene with CDP-003 and CDP-065.
  - reference: John 4:46-54
    type: enacted_or_taught_context
    note: The nobleman for his dying son.
  textual_or_editorial_note: 'Harmonization flag: Matthew presents the centurion coming in person; Luke has him plead through elders of the Jews and then friends. Both are cited; the divergence strengthens
    rather than weakens this practice, since in Luke the entire encounter is conducted through advocates. Preserve both citations and do not silently harmonize.'
  audit:
    date: '2026-08-09'
    strength_confirmed: enacted
    seed_references_verified: true
    references_added:
    - Luke 7:1-10
    - John 4:46-54
    notes: 'Seed references verified. The added references complete the pattern: five independent intercession scenes across all four Gospels — the best-attested practice in this batch.'
  card:
    what_jesus_did: |
      Four men could not get their paralyzed friend through the door to the Master, so they went through the roof. Mark's record is exact about what moved Jesus: "When Jesus saw their faith, he said unto the sick of the palsy, Son, thy sins be forgiven thee" (Mark 2:3-5). The faith of his friends moved the Lord’s heart to compassion. The man on the bed had said nothing.

      A centurion pleaded for his servant — in Matthew's account he came himself, in Luke's he sent elders of the Jews and then friends to speak for him — and Jesus not only healed the servant but marveled: "I have not found so great faith, no, not in Israel" (Matthew 8:5-13; Luke 7:1-10). Jairus fell at His feet and besought Him greatly for his little daughter — "And Jesus went with him" (Mark 5:22-24). A Greek woman of Syrophenicia pressed her daughter's case until Christ answered, "For this saying go thy way; the devil is gone out of thy daughter" (Mark 7:24-30). A nobleman of Capernaum begged for his dying son and went his way carrying the promise, "thy son liveth" (John 4:46-54).

      Notice who is absent from every scene: the sufferer. The palsied man, the servant, the two daughters, the son — none of them asked for help for themselves. Every one was blessed because someone else carried their name to Jesus. And He never once refused the borrowed faith or required the sufferer to appear in person.
    how_we_practice: |
      The discipleship practice runs in two directions. First, we must take intercessors seriously. When a worried mother brings her son's name, when a friend pleads for another friend, when someone asks you to pray for, visit, or help a third person — that is not a lesser claim than the sufferer's own. In the Gospel record it was a common way the needs of the suffering reached Jesus. Do not screen it out ("have them call me"). Act on the faith of intercessors.

      We can also serve as intercessors. We can carry names into our prayers, into church or community councils, etc. Help the sufferer find the person who can actually help, with the same determination as the friends who, finding the door to the Savior blocked, went through the roof to help their stricken brother.
    how_it_blesses_lives: |
      Some people cannot ask for themselves — pinned down by depression, pride, distance, unbelief, or a hospital bed — and without intercessors they are never reached. Where advocacy is taken seriously, the incapacitated are carried, the hopeless are honored rather than managed, and the community learns a deeply covenantal truth: faith can be exercised on behalf of another, and heaven honors it.

      I remember one winter season during which I was choosing which bills I could afford to pay for my young family. My distress and sorrow overwhelmed me with the very real possibility that I might not be able to provide any Christmas presents or even special treats for my wife and little ones. I still don’t know who knew of our situation and interceded on our behalf. Two days before Christmas, the doorbell of our apartment rang in the dark hours of the evening. No one was there when I opened the door. I looked down to discover several bags of groceries and treats on our front porch. A small box with a few thoughtful gifts for my children sat next to the food. There was a greeting card that wished us Merry Christmas from our church congregation. I still feel deep gratitude for the angel advocate that paid attention to their neighbors, recognized our distress, and blessed our family with Christlike service.
    suggested_actions:
    - 'The next time someone asks you to help a third person — a mother for her son, a friend for a friend — give it the weight you would give the sufferer''s own plea: act, do not merely sympathize.'
    - 'Be the four friends for someone this week: carry a name to the temple, into your prayers, or to the person who can actually help — and do not quit at the first blocked door.'
    - In your next council or conversation, advocate for someone who is not in the room, as the centurion's friends did.
    - Ask one person, "Who are you worried about?" — then join their intercession in some practical way.
    reflection_prompts:
    - When someone brings me another person's need, do I engage it — or deflect it?
    - For whom am I the roof-opening friend right now?
    - Whose faith carried me to Christ before I could walk to Him myself?

  - reference: Mark 9:27
    type: enacted_or_taught_context
    note: Took the convulsing boy by the hand and lifted him up.
  - reference: Mark 10:16
    type: enacted_or_taught_context
    note: Took the children up in His arms.
  - reference: Luke 7:14
    type: enacted_or_taught_context

  card:
    what_jesus_did: |
      During His mortal ministry, solitude was a rare and precious thing to Jesus of Nazareth. In all the Gospel narratives, multitudes throng Jesus in nearly every scene — pressing Him in the streets, following Him into desert places, packing the houses where He taught. Despite the noise and press of the people anxious to see the Teacher — who might just be their promised Messiah — the Lord was aware of the needs of the one among many.

      At crowded Jericho, blind Bartimaeus cried out from the roadside, and many charged him that he should hold his peace. The multitude's judgment was plain: this one does not matter. "And Jesus stood still, and commanded him to be called" (Mark 10:46-52). The procession halted. The many waited upon the one.

      Watch Him again under harder conditions. As Jesus made His way to perform a miracle in the house of Jairus, whose little daughter lay at the point of death, great crowds of the curious, the jealous, and the believers followed Him through the streets. When a woman who had suffered twelve years with an issue of blood humbly touched the hem of His garment in the crush of the crowd, Jesus said, “Who touched me?” His disciples thought His question absurd: "Thou seest the multitude thronging thee, and sayest thou, Who touched me?" (Mark 5:25-34; Luke 8:43-48). But He stopped, and He looked, and He waited until the woman came trembling and confessed to Him all the truth. The daughter of Jairus lay suffering at the end of that road, and still He gave this frightened woman His whole attention in the moment she needed Him. Bidding her farewell, He spoke kindly, "Daughter, thy faith hath made thee whole; go in peace."

      The observable pattern holds across the entire scriptural record: Jesus was never so pressed by the many that He could not stop for the one. The Gospels never show Him treating an interruption as an intrusion; again and again, the interrupted errand became part of the ministry.
    how_we_practice: |
      Attentiveness to the individual begins where Jesus' attentiveness is first visible — with stopping. Not the gawking half-stop of the busy person rushing to tend only to their own concerns, but the full stop of the Jericho road: motion halted, attention turned, needs recognized, pausing to engage with the needs of others.

      Most of us do not lack compassion; we lack interruptibility. Our schedules, to-do lists, and screens carry us past people the way the road carried the crowd past blind Bartimaeus. This discipleship practice is to treat the person in front of you as the appointment, not the obstacle to it. When someone reaches for your attention — a child at your elbow, a coworker at your desk, a stranger whose need is plain — stop completely. Face them. Let the errand wait as Jairus waited. It will feel costly, because it is: attention is the one gift that cannot be given in passing.

      Throughout my career as a teacher and vocation as a father and grandfather, I have taken to heart this Christlike practice. I have never regretted excusing myself from a conversation with another adult — even an “important” one — to turn to the waiting presence of a child. Some adults have been offended as I excuse myself to turn and look into the eyes of an interrupting child. Many of these interactions have become the most impactful moments of kindness I can remember.

      How can we participate in our communities or love our neighbors as the Lord commanded unless we notice others around us, slow down a little, and engage in their lives in small but meaningful moments?
    how_it_blesses_lives: |
      A person who has been truly seen carries the memory for years — ask anyone who was ever the one for whom somebody stood still. To the overlooked, attentiveness is a witness that they exist before God: the woman in the crowd came seeking a cure and went home having been called "Daughter." And the practice blesses the practitioner, for it slowly cures us of experiencing people as a nameless crowd. The disciple who learns to notice needs and stop discovers what the whole of Jesus' ministry demonstrates — that no Christlike virtue can be practiced toward humanity in general. Every one of them is practiced toward individuals.
    suggested_actions:
    - 'Choose one day this week to be interruptible on purpose: each time a person breaks into your plan, stop fully — body turned, screen down — and stay until the exchange ends on their terms, not yours.'
    - In your next gathering (class, meeting, family dinner), find the person at the edge of the room and learn one true thing about their day.
    - 'Each evening for a week, write one name: the person you actually stopped for that day. If a day has no name, notice it without excuse-making, and begin again tomorrow.'
    - Identify your "Jericho road" — the daily route or routine where you most reliably pass people by — and walk it once this week expecting the Lord to place someone in it.
    reflection_prompts:
    - Who has been calling from the edge of my Jericho road — and whose voice have I allowed the crowd to hush?
    - When I am interrupted, what does my body do first? What did His do?
    - Is there a difference this week between the people I served and the people I actually saw?

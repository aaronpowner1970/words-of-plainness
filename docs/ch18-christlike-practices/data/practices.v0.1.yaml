- id: CDP-037
  legacy_number: 37
  title: Follow-through / Aftercare
  descriptor: Returning after the immediate intervention to counsel, reconnect, or meet continuing need
  primary_domain: attentive-presence
  secondary_domains:
  - servanthood-stewardship
  evidence_strength: enacted
  evidence:
  - reference: John 5:14
    type: enacted_or_taught_context
    note: '"Afterward Jesus findeth him in the temple" — the verb implies deliberate seeking.'
  - reference: John 9:35-38
    type: enacted_or_taught_context
    note: Seed cited John 9:35; extended to 9:35-38 so the card can show what the second finding gave — revelation and worship, not merely sight.
  - reference: Mark 5:43
    type: enacted_or_taught_context
    note: Commanded that something be given her to eat; parallel Luke 8:55.
  textual_or_editorial_note: 'No textual-critical issues. Editorial note: John 21:15-19 is the supreme follow-through in the record; it is homed at CDP-013 (Grace & Restoration) and cross-referenced rather
    than duplicated here.'
  audit:
    date: '2026-08-09'
    strength_confirmed: enacted
    seed_references_verified: true
    references_added:
    - John 9:35-38 (extended from 9:35)
    notes: All three seed anchors verified. Both Johannine scenes use the seeking verb ("findeth" / "when he had found him") — the follow-up was sought, not incidental.
  card:
    what_jesus_did: |
      The man at the pool of Bethesda was healed and gone; the story could have ended there. It did not: "Afterward Jesus findeth him in the temple, and said unto him, Behold, thou art made whole: sin no more, lest a worse thing come unto thee" (John 5:14). Findeth — the word implies seeking. The healing was not the end of Jesus' interest in the man; He returned with private counsel for the rest of his life.

      The man born blind received his sight and was promptly cast out of the synagogue for saying so. "Jesus heard that they had cast him out; and when he had found him," He gave the man what the first meeting had not — the revelation of the Son of God, and a place to belong to when his community expelled him. The man's answer was worship (John 9:35-38). Two healings in John; two deliberate follow-up visits.

      And in the house of Jairus, the moment the child was raised, He "commanded that something should be given her to eat" (Mark 5:43). Amid the astonishment and the joy, Jesus was the one who remembered that the girl would be hungry.
    how_we_practice: |
      Follow-through is the practice of the second visit. Most service ends when the event ends — the meal delivered, the crisis calmed, the funeral held — but the record of Jesus shows help that returns. The practice is concrete: before counting any act of service finished, decide when you will go back. The month after the funeral, when the meals stop and the widow’s house goes quiet. The second week after the move into a neighborhood. The following Sundays after someone's brave return to church, when the first vulnerable visit meets a friend in order to survive into a second.

      And follow-through includes the small bodily needs that public moments forget. He raised the dead child — and then reminded the astonished adults that she would be hungry.
    how_it_blesses_lives: |
      The follow-up visit is where much of the deeper ministry happens. The man born blind was healed at the pool of Siloam, but it was when Jesus found him the second time that he came to believe and worship (John 9:35-38). People discover, in the return, the difference between being serviced and being loved: anyone may help once, but the one who comes back was thinking of you in the interval.

      I remember moving my young family to a new apartment complex while training for my career to begin. My wife was very shy and unsure of the new neighborhood. Two neighbors saw the moving truck and offered to help us take our belongings into our new home. We were very grateful despite the exhaustion. More touching to my heart was the one neighbor who knocked on our door the following week to ask how we were settling in. Smiling, she informed my wife that they were going to be good friends and that the children of our two families would play together often. She practically bustled us out of our apartment to share a meal she made for us so we could sit afterwards and get to know one another. It comforted me to know my wife was not alone with our children and no one to talk to while I spent long hours in my training.
    suggested_actions:
    - 'Choose one person you helped in the past month and go find them: how are they now, and what does the healing still need?'
    - 'Put returns on your calendar: for every act of service you render, schedule the follow-up before you count the task done.'
    - Identify someone whose crisis has drifted out of everyone's attention — the funeral past, the move completed, the baby blessed — and show up in the quiet afterward.
    - When you serve in a public moment, watch for the small bodily need everyone else forgets — the meal, the ride, the nap, the prescription — and meet it.
    reflection_prompts:
    - Whom did I help once and never see again?
    - Is my service organized around events, or around persons?
    - What has the Lord returned to give me after my first healing?

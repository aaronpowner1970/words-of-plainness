  card:
    what_jesus_did: |
      Crowds can wear compassion out. Anyone who has served the public knows how faces blur into foot traffic, how the hundredth need of the day arrives to a heart already drained of emotional endurance. Now watch the Master’s example. "But when he saw the multitudes, he was moved with compassion on them, because they fainted, and were scattered abroad, as sheep having no shepherd" (Matthew 9:36). Where we see a crowd, He saw scattered sheep — thousands of individual creatures, shepherdless — and the sight moved Him. The Gospel writers reach for the strongest word they have for inward feeling, and they use it of Him before multitudes again and again.

      And His compassion never remained just an acknowledged feeling. It became prayer and a commission to take action on the spot — "Pray ye therefore the Lord of the harvest, that he will send forth labourers" (Matthew 9:37-38). On the day He had crossed the sea seeking solitude to mourn His cousin John, the multitudes followed Him on foot; "and Jesus went forth, and saw a great multitude, and was moved with compassion toward them, and he healed their sick" (Matthew 14:14). Another day it became teaching: "he began to teach them many things" (Mark 6:34). And after three days in a desert place, it became bread: "I have compassion on the multitude, because they continue with me now three days, and have nothing to eat: and I will not send them away fasting, lest they faint in the way" (Matthew 15:32). He had counted their days without food. He was thinking about their walk home.

      Then, in His last great discourse, the Teacher revealed where all of it had been pointing. The final judgment, He taught, will be conducted in the grammar of small mercies toward overlooked people — the hungry fed, the stranger taken in, the naked clothed, the sick and the prisoner visited — and the King will say, "Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me" (Matthew 25:31-46). The least of these. The multitude, it turns out, has always been made of many individuals, each with unique needs, and even the least being of great value to God.
    how_we_practice: |
      This discipleship practice asks for something harder than a kind act: a heart that refuses to go numb at large scales. The needs of the many arrive to us as statistics, headlines, lines at the food bank, congregations full of names we have not learned — and numbness is the natural anesthetic that comes too easily to exhausted servants. The disciple fights it the way the record shows the Lord meeting crowds: by seeing the multitude as scattered sheep, one and one and one, and by letting the sight cost something.

      Practically speaking, maintenance of compassion for the many begins with routine proximity to a few of the least. Choose the overlooked margins of the multitudes: the shelters rather than the fundraising galas, the new arrivals balanced against the faces of those who belong, the aged and unvisited, the prisoner, the lonely. King Benjamin taught that we are to "impart of your substance to the poor," each "according to that which he hath," and to administer "to their relief, both spiritually and temporally" (Mosiah 4:26), and Isaiah promised light to those who will "draw out thy soul to the hungry, and satisfy the afflicted soul" (Isaiah 58:10). Drawing out the soul — not merely the checkbook — is the practice's true center. And when the scale of the world's need threatens to freeze us, we remember that He answered scale with the needs for action in front of Him: this crowd healed, the next crowd taught, another crowd fed before their long walk home.
    how_it_blesses_lives: |
      The least of these are blessed in the plainest ways scripture knows — fed, clothed, visited, taken in — and blessed deeper still by what the mercy tells them: that they did not fall below the notice of God's people, and therefore not below the notice of God. The disciple is blessed with the enlargement of a heart that stops sorting people into the mattering and the not-mattering; and, if the Lord's own account of the judgment is to be trusted, the disciple is blessed with something greater, for it is the Lord we have been serving all along. When the multitudes press upon your attention this week — and they will — what would change if you saw, even once, not a crowd but individual sheep of the Good Shepherd?
    suggested_actions:
    - Choose one of the six mercies of Matthew 25 — feed, give drink, take in, clothe, visit the sick, visit the prisoner — and perform it in person this month, toward someone with no claim on you.
    - When a need arrives as a number — a headline, a statistic, a long line — pray for one person inside the multitude by name, and then take whatever actions you can that are right in front of you.
    - 'Volunteer where the overlooked actually are: a shelter, a care facility, a prison ministry, a refugee-welcome effort — and return often enough to learn names.'
    - Audit one month of your giving and service; ask whether any of it reaches "the least of these," and adjust one commitment accordingly.
    reflection_prompts:
    - What happens in my heart when need arrives at scale — and what would it take to see sheep instead of crowds?
    - Which of the six mercies of Matthew 25 is missing from my discipleship?
    - Who are "the least" in my own town — and when did I last stand close enough to them to be moved?

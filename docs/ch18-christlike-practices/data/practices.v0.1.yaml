- id: CDP-004
  legacy_number: 4
  title: Holy Touch and Proximity
  descriptor: Contact before cure; presence before rescue
  primary_domain: attentive-presence
  secondary_domains:
  - dignity-belonging
  evidence_strength: enacted
  evidence:
  - reference: Mark 1:40-45
    type: enacted_or_taught_context
    note: Touch precedes the healing word; triple tradition (Matthew 8:1-4; Luke 5:12-16).
  - reference: Mark 1:31

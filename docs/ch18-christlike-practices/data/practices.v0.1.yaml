  card:
    what_jesus_did: |
      The man who lay each day by the pool of Bethesda had been infirm for thirty-eight years. He was quiet — he had stopped expecting anyone to help — but he longed for a miracle. When the Savior inquired, the man confessed: "Sir, I have no man" — no advocate, no helper, nobody. He likely would not have said anything, continuing to live as a forgotten outcast, had Jesus not noticed him first and approached uninvited.

      Jesus did this constantly throughout his ministry.

      Zacchaeus, the despised chief publican of Jericho, intended only to watch from the safety of a sycamore tree; the Lord looked up, called him by name, and invited Himself to the man's house (Luke 19:5).

      In a synagogue stood a woman suffering physical disability for eighteen years, who lifted no hand and made no request. "And when Jesus saw her, he called her to him" (Luke 13:11-13).

      At the gate of Nain He met a funeral procession: a widow on her path to bury her only son, consumed by grief and well past asking anything of anyone. "And when the Lord saw her, he had compassion on her, and said unto her, Weep not" — and He came and reverently touched the casket frame (bier) while the mourners stood still (Luke 7:12-14).

      When His disciples looked at a man blind from birth and saw a theological puzzle, Jesus saw a child of God, and ministered to him without being asked (John 9:1-7).

      And what He did, He also taught.

      To His host at a Pharisee's table He said: "But when thou makest a feast, call the poor, the maimed, the lame, the blind: And thou shalt be blessed; for they cannot recompense thee" (Luke 14:12-14).

      Disciples must not wait for the excluded or marginalized souls to find their way to your doorstep. They will not, often cannot — exclusion is precisely the condition of having learned to stop asking.

      The Gospel writers do not tell us why these excluded souls stopped asking, but the pattern of the scenes speaks for itself — the people Jesus approached first were consistently the ones whose circumstances had taught them that no one was coming.

      A follower of Christ must reach out. Go first. Invite first.
    how_we_practice: |
      This discipleship practice is the deliberate reversal of the polite habit of waiting to be asked. The lonely, the new, the ashamed, and the long-excluded rarely ask. The man at Bethesda had thirty-eight years of evidence that no man would help him; people in our own congregations, workplaces, and neighborhoods carry the same quiet resignation. If we serve only on request, we will serve everyone except those who need it most.

      So the disciple moves first. Cross the room toward the visitor standing alone. Move to visit the family that stopped coming. Extend the dinner invitation to the person who has never once been invited — King Benjamin taught that we should not "suffer that the beggar putteth up his petition... in vain" (Mosiah 4:16), and pure religion, James wrote, is "to visit the fatherless and widows in their affliction" (James 1:27) — to visit, not to await their call. The invitation the Lord gave Zacchaeus cost Him only a sentence, and it changed a household forever.

      Imagine what it would be like for you to move to a new community and be greeted by neighbors introducing themselves, offering to help you move in, inviting you to local social activities. Have you ever had the experience of quietly struggling with some part of your life and someone noticed and gently asked if they could help? One of the worst experiences in life is feeling invisible.
    how_it_blesses_lives: |
      For the excluded, the first move is the unexpected miracle. Before any need is met, the surprising approach announces a precious message to a hungry soul: someone noticed you, someone crossed the line for you, you were worth the effort. Many souls who could never have walked into a chapel alone have been made more comfortable doing so beside a friend who invited them. And the practice blesses the one who moves, curing us of the comfortable lie we have told ourselves, that our open door is the same thing as an outstretched hand. The Savior's way blesses the ones who gave up knocking on the door to the Kingdom long ago.
    suggested_actions:
    - At your next church meeting or gathering, find the person standing alone and reach them before they have to reach for anyone.
    - Think of someone who has quietly stopped appearing — at church, at family dinners, in the group chat — and make the first contact this week, without waiting for a reason.
    - Extend one invitation this month to a person or family who, as far as you know, is never invited — and let it cost you something, as a real feast does.
    - Ask the Lord in prayer to show you one person who has stopped asking for help, and go to them as though He had sent you — because He has.
    reflection_prompts:
    - Who around me has stopped asking — and how long have I mistaken their silence for contentment?
    - When I serve, is it on my terms, awaiting requests — or on His, moving first?
    - Who once crossed a room, a street, or a doorstep for me before I could ask?

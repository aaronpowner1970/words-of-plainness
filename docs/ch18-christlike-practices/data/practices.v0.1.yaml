  textual_or_editorial_note: 'No textual-critical issues. Luke 10:42 carries a known manuscript variation ("one thing is needful" vs. "few things are needful, or one"); the practice rests on verses 39-40 and the defense of Mary''s learner role, which are secure. Behavior-first note: the claim is not that first-century roles were formally overturned, but the observable one — persons whom the era assigned to the margins appear in the record as learners, patrons, heralds, and first witnesses, placed there by His word or welcome.'
  audit:
    date: '2026-08-10'
    strength_confirmed: enacted
    seed_references_verified: true
    references_added:
    - John 4:28-30, 39
    - Mark 5:18-20
    - Matthew 21:14-16
    notes: 'All three seed anchors verified. The additions complete the arc the seed began: alongside learner (Luke 10), supporters (Luke 8), and first witness (John 20), the record supplies two commissioned heralds from the margins (Samaria, Decapolis) and the temple''s smallest praisers defended. Six scenes, four Gospels. Author edit (Aug 17): witness filled (students given laboratory responsibility).'
  card:
    what_jesus_did: |
      It is possible to serve the marginalized and still keep them marginal — helped, fed, prayed over, and permanently assigned to the receiving end. The record of Jesus of Nazareth shows something different, and watch how consistent it is: the people His own culture pushed to the edges often appear in His company holding important roles in the ministry.

      In Bethany, Mary "sat at Jesus' feet, and heard his word" — the posture of a disciple before a rabbi, a place her world did not offer women. When Martha appealed to Him to send Mary back to the serving, the Teacher defended the student's seat: "Mary hath chosen that good part, which shall not be taken away from her" (Luke 10:38-42). Traveling with Him through every city and village went women He had healed — Mary called Magdalene, Joanna the wife of Chuza, Susanna, and many others — "which ministered unto him of their substance" (Luke 8:1-3). The formerly afflicted were not trailing the ministry as its beneficiaries. They were sustaining it as its patrons.

      And when He had messages to carry, mark whom the Lord chose. The Samaritan woman left her waterpot and became her city's first preacher of the Christ — "and many of the Samaritans of that city believed on him for the saying of the woman" (John 4:28-30, 39). The healed man of the tombs begged to travel with Him and was given a greater dignity instead: "Go home to thy friends, and tell them how great things the Lord hath done for thee" — and Decapolis heard it from its own former madman (Mark 5:18-20). On the morning of mornings, the risen Savior entrusted the news on which all Christianity stands to Mary Magdalene: "go to my brethren, and say unto them, I ascend unto my Father, and your Father" (John 20:17-18). And when children filled the temple with hosannas and the chief priests were sore displeased, He legitimized the smallest voices in the house: "have ye never read, Out of the mouth of babes and sucklings thou hast perfected praise?" (Matthew 21:14-16).
    how_we_practice: |
      This discipleship practice completes every other practice in this domain, and guards them all from a subtle failure: the failure of perpetual charity — help that never graduates into fellowship, welcome that never ripens into responsibility. To dignify people as contributors is to trust them with the same roles the Lord kept assigning: the learner, the supporter, and the messenger.

      Practically, it means we stop asking only "what does this person need?" and begin also asking "what does this person have to offer?" The refugee family has recipes, skills, and faith our congregation has never tasted. The brother in recovery can reach the still-struggling as no lifelong rule-follower can. The widow on a fixed income may only have two mites, but many decades of testimony. The teenager, the new convert, the member with a disability — each arrives bearing gifts, and a community that only serves them quietly tells them their gifts are not wanted. Paul taught the Corinthians that the body's "more feeble" members are "necessary" (1 Corinthians 12:21-22), and the Lord declared in this dispensation that "to every man is given a gift by the Spirit of God," and that all these gifts come from Him "for the benefit of the children of God" (D&C 46:11; D&C 46:26) — given to be used, not merely appreciated.

      So we call the marginalized into church and community roles, real ones. We ask their counsel and take it. We let the helped become hosts, the taught become teachers, the once-carried become carriers.

      I recall many youths in my classroom that paled at being given roles of responsibility within my laboratory or in small groups of learners, but who blossomed into capable leaders that influenced the lives of their peers in positive ways. Each has something to contribute, though they may need some encouragement to do so.
    how_it_blesses_lives: |
      Being served meets a person's needs; being needed restores their name. The marginalized soul who is handed a role discovers what no amount of receiving could prove — that they belong to the body as a member, not as a case. Communities are enriched in plain, countable ways, for the margins hold gifts the center lacks: Decapolis could be reached by its own healed man as by no apostle. And the disciple who learns to see carriers where others see cases is seeing, at last, the way the Master saw — He who looked at a Samaritan woman with five griefs behind her and saw the first missionary to Samaria.
    suggested_actions:
    - Identify one person your circle has filed under "needs help," and this month ask for their help — their counsel, their skill, their story — in something real.
    - If you extend callings, assignments, or invitations, place a marginalized member in a role of genuine trust, and support them in it past the awkward first weeks.
    - Invite someone who is always the guest to be the host, the teacher, or the leader once — and receive what they bring the way the Lord received the alabaster box.
    - Ask a person who has come through affliction — grief, addiction, illness, displacement — whether they would carry their witness to someone now in it.
    reflection_prompts:
    - Whom do I serve faithfully but have never once needed?
    - Do the people at the edge of my community hold roles — or only receive services?
    - What gift arrived in my life through someone the world had classified as a recipient?

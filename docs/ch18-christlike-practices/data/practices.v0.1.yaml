  card:
    what_jesus_did: |
      In the house of Simon the leper, a woman broke an alabaster box of ointment of spikenard, very precious, and poured it on the head of Jesus. The room did the arithmetic instantly: "Why was this waste of the ointment made? For it might have been sold for more than three hundred pence, and have been given to the poor. And they murmured against her." The Master received the gift, and then He received the giver: "Let her alone; why trouble ye her? she hath wrought a good work on me... She hath done what she could." And then He did something recorded of no other gift in the Gospels — He made it eternal: "Verily I say unto you, Wheresoever this gospel shall be preached throughout the whole world, this also that she hath done shall be spoken of for a memorial of her" (Mark 14:3-9).

      He had received such devotion before, in another house, from a woman with even less standing. She washed His feet with tears, wiped them with the hairs of her head, and anointed them — while the host silently concluded that a true prophet would have refused such a woman's touch. Jesus of Nazareth did not refuse her act of service. He did not recoil at her touch. He was not made uncomfortable by her devotion. He read her extravagance rightly — "Her sins, which are many, are forgiven; for she loved much" — and let the gift stand as evidence of her heart (Luke 7:36-50).

      And He weighed gifts this way even when the gift was not for Him. Sitting over against the treasury, He watched the rich cast in much, and a poor widow cast in two mites. The Lord called His disciples to Him for a lesson they would never have seen: "this poor widow hath cast more in, than all they which have cast into the treasury: For all they did cast in of their abundance; but she of her want did cast in all that she had, even all her living" (Mark 12:41-44). What He valued were the anointing hands of the repentant woman. He treasured the faith and love of the poor widow.
    how_we_practice: |
      Gracious receiving is the discipleship practice of honoring the giver in the gift — especially when the gift is awkward, small, extravagant, or easy to belittle. The child's crumpled dandelion bouquet, the widow's carefully counted contribution, the new convert's over-eager offer to help, the struggling neighbor's plate of food we did not need — each arrives, like the alabaster box, with a heart inside it. Whoever receives the gift carelessly handles the heart carelessly.

      So the disciple receives the way the Savior received: fully, warmly, and without correcting the gift. We do not deflect ("you shouldn't have"), appraise ("this was too much"), or improve ("next time, what would really help is..."). We let the giver do what they could, and we say so — for as Paul taught the Corinthians, "if there be first a willing mind, it is accepted according to that which a man hath, and not according to that which he hath not" (2 Corinthians 8:12), and the prophet Mormon taught that the value of an offering lives in the intent of the heart (Moroni 7:6-8). Receiving is not passivity. Done Christlike, it is an act of honor performed toward the giver, and sometimes it is the greater half of the exchange.

      One of the most treasured gifts I ever received was a toy car from a student. It was a crudely-painted miniature, scuffed and worn in places, and awkwardly placed on my teacher desk by a shy hand. The giver was a pre-verbal special education student, 15-years-old and struggling with progression on the Autism spectrum. I thanked him warmly and enjoyed his quiet smile. I didn’t find out until later, when His mother told me in an after-school conference, that the toy car was his prized possession, an emotional support item he carried daily to school. She assured me that he wanted to give it to me. I didn’t dare try to give it back. I proudly displayed it on my shelf of favorite science laboratory models and curiosities as an item of unequaled value.
    how_it_blesses_lives: |
      The belittled giver, received graciously, learns that their love registered — that the measure of their offering was taken by the heart and not by face value. For the poor, the young, the new, and the unskilled, this is the difference between offering themselves again and never risking it twice. A community that receives this way soon abounds in givers, for people bring their two mites where two mites are weighed like treasure. And the disciple who learns to receive is healed of a subtle pride, the kind that will serve anyone but be served by no one — a pride the Lord did not model. He who owed nothing to anyone let women anoint His feet, and made one such gift a memorial for the whole world.
    suggested_actions:
    - Receive the next gift you are given — however small or imperfect — with full attention and thanks, and without one word of deflection or appraisal.
    - Think of a gift you once discounted — a child's offering, a modest act of service — and honor it now, out loud, to the giver if you can.
    - When someone offers to serve you and your instinct says "I'm fine," accept anyway once this week, and let them have the blessing of giving.
    - In your family or class, publicly honor a two-mite gift — the small faithful offering everyone else overlooked.
    reflection_prompts:
    - How do I receive gifts I did not want, did not need, or could have bought better myself?
    - Whose "alabaster box" have I priced instead of honored?
    - Am I willing to be the one ministered unto — or must I always hold the giver's role?

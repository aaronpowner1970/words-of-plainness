- id: CDP-058
  legacy_number: 58
  title: Checking Whether Help Actually Helped
  descriptor: Assessing the outcome of an intervention and responding again when needed
  primary_domain: attentive-presence
  secondary_domains:
  - forming-others
  evidence_strength: enacted
  evidence:
  - reference: Mark 8:23-25
    type: enacted_or_taught_context
    note: The only two-stage healing in the Gospel record; the hinge between the stages is a question.
  - reference: Mark 9:21
    type: enacted_or_taught_context
    note: 'Corroborating the habit of inquiry: "How long is it ago since this came unto him?" — assessment before assistance; a supporting reference, not a second anchor.'
  textual_or_editorial_note: 'Singly attested (Mark only); verses 23-25 are textually secure (the manuscript variation in this pericope concerns v. 26, flagged at CDP-036). Behavior-first caution: scholars
    offer several readings of why the healing was staged; the card claims only the observable sequence — intervention, inquiry, honest report, renewed intervention.'
  audit:
    date: '2026-08-09'
    strength_confirmed: enacted
    seed_references_verified: true
    references_added:
    - Mark 9:21
    notes: Seed anchor verified. Single-witness anchor is acceptable — the episode is distinctive, coherent with Mark's aside-taking pattern, and the practice claim is modest.
  card:
    what_jesus_did: |
      At Bethsaida something occurs that is recorded nowhere else in the four Gospels. Jesus took a blind man by the hand, led him out of the town, anointed his eyes, put His hands upon him — "and asked him if he saw ought." The man's answer was honest, the healing had been incomplete: "I see men as trees, walking." So Jesus "put his hands again upon his eyes, and made him look up: and he was restored, and saw every man clearly" (Mark 8:23-25).

      It is the only healing in the record that unfolds in two stages, and the hinge between the stages is a question: Christ asked a question. The truth was received without offense, and the help was applied again until it had fully helped. He did not send a half-seeing man home. The Lord’s same habit of inquiry appears elsewhere before He helps: "How long is it ago since this came unto him?" He asked the father of an afflicted boy (Mark 9:21). Whatever else this narrative teaches, the observable behavior forms a pattern any disciple can imitate — notice a need, intervene, inquire, receive the honest answer, and act again if needed. Help is not finished until the effect is verified.
    how_we_practice: |
      The practice is to ask "did that actually help?" or “is there anything we overlooked?” — and actually mean it. Much of our helping quietly serves our own righteous desire to go about doing good like Jesus: we give the counsel, deliver the assistance, perform the fix, and too quickly record the matter closed without ever asking the one person who knows best, the recipient of the help.

      That requires not taking offense when our efforts have not had the intended effect. An honest report of partial success is not ingratitude; it is precisely the information that makes the second healing touch possible. Ask, hear, adjust, and continue until the help has helped.
    how_it_blesses_lives: |
      I remember a precious moment when my oldest daughter was three or four years old. I noticed her sitting alone and quietly on a chair with her little face scrunched up and a tear forming in her eye. I asked, “What’s wrong sweetie?” Her answer, “I have a headache.” My instincts as a father and all my previous medical training combined with my confidence that I knew just what to do. I diligently taught her about children’s pain relievers and gave her the dosage indicated in the instructions. I felt satisfied and a little proud that I was such a good father, but after about thirty minutes I noticed that she was still crying. “Did the medicine help your head?” I asked. She looked at me somewhat skeptically and said, “No, daddy! I have a headache in my toe.” Taking off her sock, she showed me a hangnail that had torn into the quick of her nailbed.

      I acted with confidence and listened poorly. I half helped her, but failed to notice the true need. Yes, she could have stated the problem more clearly, but didn’t know how. Apologizing for the misunderstanding, I helped her trim the hangnail and clean the little spot of blood where the skin had torn. One cartoon-themed bandage and a kiss on the forehead later, and the help was applied correctly.

      Half-helped people get frustrated — and there are more of them around us than our assumptions allow. Seeking honest feedback becomes a place of safety for those in need, which changes every relationship it touches: children, students, spouses, and friends stop performing gratitude and start telling the truth. And the disciple is converted from performing a service to completing it — growing at once humbler and more effective.
    suggested_actions:
    - Ask one person you have recently served, "Did that actually help? What would help more?" — and receive the answer without defending your effort.
    - 'When you give counsel, close the loop: return in a week, ask what happened, and be prepared to counsel differently.'
    - 'Practice the second touch: take one situation where your first attempt to help fell short, and instead of writing it off, try again with what you now know.'
    - Ask a family member or friend for a candid report on whether one specific way you "help" them actually helps them — and act on what you hear.
    reflection_prompts:
    - Do I ask how my help landed, or do I assume it landed?
    - How do I receive the answer "I see men as trees, walking"?
    - Is there someone I left half-helped because finishing was inconvenient?

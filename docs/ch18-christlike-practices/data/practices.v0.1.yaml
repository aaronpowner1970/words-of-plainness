  card:
    what_jesus_did: |
      The world Jesus of Nazareth navigated was mapped and divided with invisible cultural lines — lines of purity and contamination, Jew and Samaritan and Gentile, male and female, righteous and sinner. The remarkable thing that the Gospel narratives record is not that Christ knew where the lines lay. Everyone knew. It is that He crossed them, and did it deliberately.

      Watch Him at Jacob's well. Tired from His journey, the Teacher sat on the well and asked a Samaritan woman for a drink — and with that one request crossed the lines of nation, gender, and centuries of religious hostility at once. She named the boundary herself, astonished: "How is it that thou, being a Jew, askest drink of me, which am a woman of Samaria? for the Jews have no dealings with the Samaritans" (John 4:1-42). His own disciples, returning, "marvelled that he talked with the woman." Yet it was to this unlikely stranger that the Messiah plainly declared who He was, not to the Pharisees and scribes of Jerusalem.

      The pattern holds everywhere Jesus went. A leper knelt before Him, a man whom the law of Moses placed beyond touch, and Jesus, "moved with compassion, put forth his hand, and touched him" (Mark 1:40-45) — the purity line crossed bodily before a word of healing was spoken. In the coasts of Tyre, a Gentile country no rabbi wished to enter, He heard a Greek woman's plea for her daughter and answered it (Mark 7:24-30). At Levi's house He sat at meat with "many publicans and sinners," and when the scribes demanded to know why, the Lord declared the nature of His mission: "They that are whole have no need of the physician, but they that are sick" (Mark 2:15-17). And to a Roman centurion — an officer of the occupying Gentile army — He offered what no Jewish priest would offer: "I will come and heal him" (Matthew 8:5-13).

      Notice what is absent from every one of these scenes: any mention that boundaries were being broken. The Savior never congratulated Himself on His tolerance or greatness of heart, never made the crossing a spectacle. He simply went where love required and let the scandalized hypocrites say what they would.
    how_we_practice: |
      Our modern social stratas have different labels than first-century Judea's, but every community still maintains them — lines of politics, creeds and denominations, income, nationality, language, lifestyle, and reputation that quietly tell us whom we may approach and whom we should avoid. This discipleship practice begins by admitting that we see the social boundaries, have prayerfully considered both safety and wisdom, and then we cross the lines on purpose.

      The form of the crossing takes simple shapes: a greeting, a shared meal, a learned name, a doorstep visited. What makes it Christlike is the direction — toward the person we normally avoid — and the manner in which we do so. We go without fanfare, without virtue signaling, and without requiring the other person to become like us before we come near. The Apostle Paul testified that Christ "is our peace, who hath made both one, and hath broken down the middle wall of partition between us" (Ephesians 2:14), and the Book of Mormon bears the same witness, that Christ "denieth none that come unto him, black and white, bond and free, male and female," and that "all are alike unto God" (2 Nephi 26:33). A disciple who rebuilds a wall between children of God — even a polite, unspoken one — is working against his own Master. Worse are those that discourage the faith of others in Jesus Christ over differences in creed or doctrine. The Apostles urged and sometimes sharply commanded the different churches in the letters of the New Testament to “have compassion on the ignorant, and on them that are out of the way” explaining that “the servant of the Lord must not strive; but be gentle unto all men, apt to teach, patient, in meekness instructing.” (Hebrews 5:2; 2 Timothy 2:24-25)

      Most sobering to all His sincere disciples is Jesus’ plain condemnation of the priests and teachers of His day, "Hypocrites! for ye shut up the kingdom of heaven against men” and pointing out the priority of the following gospel principles over theological doctrines: “judgment, mercy, and faith.” (Matthew 23:13; Matthew 23:23) How terrifying would it be to receive such a rebuke when thinking we were doing heaven’s will?

      Jesus’ teachings center on unconditional love, radical forgiveness, and humble service. We are not required to agree with one another’s values or moral choices. We are not expected to participate in social behaviors that we would not embrace ourselves. He emphasized time and again a spiritual kingdom defined by compassion and grace rather than religious status, theologies, or church politics. Any correction of sin or error in doctrine is to be done with gentleness and respect (1 Peter 3:15).

      Christlike boundary-crossing is at the center of this Words of Plainness ministry. Every time I’ve participated in interfaith discussions, I have been pleasantly surprised at how willing most people are to focus on the things we have in common rather than those things that divide us. It is refreshing, for, “where two or three are gathered together in my name, there am I in the midst of them.” (Matthew 18:20) Notice that He did not qualify this to two or more who agree on human-codified creeds, confessions, traditions, authorities, theologies, and interpretations.
    how_it_blesses_lives: |
      The person on the far side of the line receives something rarer than help: the discovery that the gospel has no fence around it, and that they were never outside the reach of God's love. The woman of Samaria came to the well for water and went back into the city with a godly witness. And this practice blesses the one who crosses, for every line we walk over redraws our map a little more like His, until we can no longer remember why the far side once looked far. How many friendships, and how many households of faith, are waiting on the other side of lines that the Lord never drew?
    suggested_actions:
    - Share a meal this month with someone across a line your circle does not usually cross — a different faith, politics, language, or background — and go as a learner, not a debater.
    - Learn the name of one person your daily route trains you to pass by — the guard, the clerk, the man on the corner — and use it every time after.
    - Identify the group your own community most easily jokes about or avoids, and make one act of unannounced kindness toward someone in it this week.
    - When an acquaintance from the far side of a boundary faces a hard moment — a loss, an illness, a move — cross the line bodily; show up as you would for someone in your own pew.
    reflection_prompts:
    - Where are the lines on my map — and who drew them?
    - When did I last enter a room, a home, or a conversation where I was the outsider?
    - Is there a person I have been loving from behind a wall of partition Christ already broke down?

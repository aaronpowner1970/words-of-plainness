- id: CDP-056
  legacy_number: 56
  title: Non-Gatekeeping Toward Goodness Outside One's Group
  descriptor: Refusing to forbid good merely because the doer is outside one's immediate circle
  primary_domain: dignity-belonging
  secondary_domains:
  - truth-agency
  evidence_strength: taught_and_enacted
  evidence:
  - reference: Mark 9:38-40
    type: enacted_or_taught_context
    note: 'The ruling itself: "Forbid him not... he that is not against us is on our part." Shared scene with CDP-044 (the correction of John''s gatekeeping); the lens here is the outsider''s good honored.'
  - reference: Luke 9:49-50
    type: enacted_or_taught_context
    note: 'Parallel of the same episode (double tradition of one scene — see audit note).'
  - reference: Luke 10:30-37
    type: enacted_or_taught_context
    note: 'The taught dimension: a Samaritan — the outsider par excellence — deliberately cast as the exemplar of neighbor-love, and the lawyer commanded, "Go, and do thou likewise."'
  - reference: Luke 17:15-19
    type: enacted_or_taught_context
    note: 'A second enacted scene: the Samaritan leper''s gratitude publicly honored — "save this stranger" — and his faith affirmed.'
  - reference: Matthew 8:10-11
    type: enacted_or_taught_context
    note: 'Supporting: a Roman''s faith ranked above any in Israel, with many promised "from the east and west" at Abraham''s table. Shared with CDP-050 (affirmation lens) and CDP-059.'
  textual_or_editorial_note: 'No textual-critical issues. Audit finding behind the grade change: the two seed references are the same episode in double tradition — effectively a single scene, thin footing for a standalone practice. The added references broaden the base: Luke 10:30-37 supplies an explicit teaching (an outsider as the commanded moral example), and Luke 17:15-19 a second enacted affirmation. The upgrade was accepted by the author at the Batch 2 review (August 17, 2026).'
  audit:
    date: '2026-08-10'
    strength_confirmed: taught_and_enacted
    seed_references_verified: true
    references_added:
    - Luke 10:30-37
    - Luke 17:15-19
    - Matthew 8:10-11
    notes: 'Seed references verified but found to be one scene, not two. Additions establish the pattern across teaching and event: the exorcist not forbidden, the Samaritan made the exemplar, the stranger''s gratitude crowned, the centurion''s faith ranked first. The practice is among the best-attested dispositions in the record once the lens widens beyond the single Markan scene. Upgrade to taught_and_enacted accepted by the author, Aug 17, 2026. Witness filled at the author''s final pass (first-person interfaith testimony) with a doctrinal close added (John 3:17; 1 Timothy 2:4; John 17:20-26); the Moroni 7:16 sentence removed at the author''s direction. Mechanical fix applied Aug 17: the close''s salvation quotation re-cited from NIV-diction "2 Peter 3:9" to KJV 1 Timothy 2:4 — flagged for the author''s veto.'
  card:
    what_jesus_did: |
      John came to the Master with a report he plainly expected to be praised for: "Master, we saw one casting out devils in thy name, and he followeth not us: and we forbad him, because he followeth not us." Hear the credential twice given — he followeth not us. Not: he did harm. Not: he taught falsely. Only: he is not ours. The Lord's answer overruled the whole instinct in three words: "Forbid him not: for there is no man which shall do a miracle in my name, that can lightly speak evil of me. For he that is not against us is on our part" (Mark 9:38-40; Luke 9:49-50). Good being done in His name, by a man outside the circle, was to be left alone — more than left alone, counted as on our part.

      When the Teacher wanted an example of neighbor-love for a lawyer inquiring of His own people, He reached deliberately outside the covenant community for His hero: "But a certain Samaritan, as he journeyed, came where he was: and when he saw him, he had compassion on him." Priest and Levite — the insiders — pass by; the outsider binds the wounds and pays the innkeeper. Then the command that seals the scandal: "Go, and do thou likewise" (Luke 10:30-37). Go imitate a Samaritan. And when ten lepers were cleansed and only one returned to give glory to God, the Savior publicly crowned the exception: "There are not found that returned to give glory to God, save this stranger" (Luke 17:15-19). Of a Roman centurion He declared, "I have not found so great faith, no, not in Israel," and promised that many should come from the east and west to sit down with Abraham (Matthew 8:10-11).

      The record allows a plain conclusion: Jesus of Nazareth never once diminished goodness, faith, or mercy because of where it came from. His followers tried gatekeeping, but He shut it down quickly.
    how_we_practice: |
      This discipleship practice asks us to bless goodness wherever God has planted it — including outside our congregation, our tradition, our party, and our people. The gatekeeping reflex is religious history's oldest temptation: Moses' own aide begged him to silence two unauthorized prophets, and received the answer that prefigures the Lord's — "Enviest thou for my sake? would God that all the Lord's people were prophets" (Numbers 11:29). The people of Alma learned the same largeness: they did not withhold their generosity from anyone in need, "whether out of the church or in the church, having no respect to persons" (Alma 1:30).

      Practically: when another church feeds the hungry, we rejoice and say so. When a neighbor of another faith — or none — models honesty, sacrifice, or devoted family love, we name it as the goodness it is, without an asterisk. When help arrives for our cause from outside our circle, we receive it as the Lord received the Samaritan's gratitude: as glory given to God. Goodness outside our gates is not a rival's success. It is our Divine Father's image, showing His light from within unexpected sources.

      I have known atheists who were ethical, kind, and tender-hearted to the needs of others in their community. I have also known theists — in a variety of religions — who were the cruelest and coldest examples of humanity I could imagine. As a Latter-day Saint Christian, I have been welcomed into prayer groups by Baptists, Episcopalians, Catholics, Orthodox, Lutherans, Jews, Muslims, and countless other sects of peoples who recognize the value of faith and goodness of people outside their own circles of belief. I have also been condemned and informed — angrily and gleefully in equal measure — that I am demonically possessed and will go straight to hell by some others who claim to have been saved and sanctified by the grace of Jesus Christ, or by those who worship some other conception of the love of God. Can I perform acceptable acts of neighbor-love as did the good Samaritan? Can I do good in the world in the name of Jesus Christ, when some consider me outside the circles of acceptable creeds or discipleship?

      The Bible says that Jesus did not come to condemn the world, but to save (John 3:17). We should not condemn. The Lord "will have all men to be saved" (1 Timothy 2:4). We should not exclude or alienate anyone from His grace. Jesus prayed that we be one with each other, that we may be one with Him, and one with the Father. (John 17:20-26). We should neither divide nor dissect the faith of others whose hearts hunger and thirst after righteousness, who seek to do good among their community.
    how_it_blesses_lives: |
      Those outside the circle receive from us the honor their goodness has always deserved — and often, it serves as their first unguarded look at the Christ we follow, for people listen longest to those who have blessed them without an agenda. The kingdom is blessed, because forbidden allies stay strangers while welcomed ones become friends: "he that is not against us is on our part." And the disciple is healed of the envy that shrivels sectarian hearts, learning to rejoice in every cup of cold water given anywhere in the Master's name. Whose good work, in a circle outside my own, deserves my ungrudging word of honor?
    suggested_actions:
    - Publicly praise, this week, a good work done by another church, tradition, or group your circle tends to discount — without qualification or comparison.
    - Join an effort you do not lead and did not found — another congregation's food drive, a community cause — and serve happily under their name.
    - 'When someone in your circle dismisses an outsider''s goodness ("but they''re not..."), answer with the Lord''s rule, kindly and out loud: forbid them not.'
    - Thank one person of another faith, or none, for a specific goodness you have observed in them — and tell them what it taught you.
    reflection_prompts:
    - What goodness have I discounted because of the name on its door?
    - When help or truth arrives from outside my circle, is my first reflex gratitude — or gatekeeping?
    - Would the people of other faiths who know me say I honor the good in them ungrudgingly?

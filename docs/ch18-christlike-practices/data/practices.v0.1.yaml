- id: CDP-068
  legacy_number: 68
  title: Dignifying Marginalized People as Contributors
  descriptor: Treating marginalized people as participants, learners, supporters, and messengers rather than permanent recipients
  primary_domain: dignity-belonging
  secondary_domains:
